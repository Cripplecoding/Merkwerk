<title>Merkwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Heft-Raster. Eine Spalte Arbeitsfläche (max 1040px) unter einer festen Reiterleiste; Karopapier nur als Grund der Kopfzeile. */
:root{
  --paper:#f5f7f4; --sheet:#ffffff; --ink:#1b2130; --muted:#5d6577; --line:#dfe3e8; --grid:#e8ece9;
  --accent:#2a46c4; --accent-ink:#ffffff; --accent-soft:#e6eafb;
  --mark:#e9f26b; --mark-ink:#2b2f0a;
  --ok:#1d7f52; --ok-soft:#e1f3ea; --bad:#b83a32; --bad-soft:#f9e4e2; --warn:#a86200; --warn-soft:#fbefd9;
  --orange:#d26a00; --orange-soft:#fdebd6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141b; --sheet:#181c25; --ink:#e7e9ef; --muted:#9aa2b4; --line:#2a303d; --grid:#1a1f29;
  --accent:#8fa2ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --mark:#c9d443; --mark-ink:#1a1d05;
  --ok:#53c48e; --ok-soft:#14301f; --bad:#f08a80; --bad-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#3a2a10;
  --orange:#ff9a3d; --orange-soft:#3d2610;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11141b; --sheet:#181c25; --ink:#e7e9ef; --muted:#9aa2b4; --line:#2a303d; --grid:#1a1f29;
  --accent:#8fa2ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --mark:#c9d443; --mark-ink:#1a1d05;
  --ok:#53c48e; --ok-soft:#14301f; --bad:#f08a80; --bad-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#3a2a10;
  --orange:#ff9a3d; --orange-soft:#3d2610;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Kopfzeile: Logo, Hauptnavigation, Konto */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 2px;margin-left:-2px;border-radius:10px;cursor:pointer;color:var(--ink)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.03em;line-height:1}
.brand b span{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.top-acc{display:flex;align-items:center;gap:8px;margin-left:auto;order:3;min-width:0}
.top-acc .acc{padding:3px 10px 3px 3px;min-height:36px}
.top-acc .who{max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;flex:none}
.avatar.big{width:48px;height:48px;font-size:1.3rem}
.acc-name{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest .tabs,.guest #profileChip{display:none!important}
.welcome{max-width:720px;margin-inline:auto;padding-top:clamp(12px,5vh,56px)}
.welcome-hero{gap:10px}
.welcome-hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.welcome-choice .wizard-opt{padding:22px 20px;min-height:110px;justify-content:center}
.welcome-choice .wizard-opt b{font-family:var(--f-display);font-size:1.25rem}
.wizard-opt.primary-opt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wizard-opt.primary-opt .muted{color:inherit;opacity:.85}
.welcome-card{gap:14px}
.welcome-card h1{font-size:clamp(1.5rem,4vw,2.1rem)}
.auth-list{gap:10px}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;width:100%;font-weight:700}
.track-pick{grid-template-columns:1fr 1fr}
.track-pick .wizard-opt{min-height:120px;justify-content:center;align-items:center;text-align:center}
.track-pick .wizard-opt b{font-family:var(--f-display);font-size:1.3rem}
.gen-src{display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;order:2;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap;min-height:40px}
.tab:hover{color:var(--ink);background:var(--paper)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.subj:focus-visible,.wizard-opt:focus-visible,.opt:focus-visible,.pick:focus-visible,.org-tile:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){.tabs{order:4;flex:none;width:calc(100% + 32px);margin:0 -16px;padding:0 12px 2px}.top-acc .who{display:none}.tab{padding:9px 10px}.tab-long{display:none}.top-in{padding-bottom:6px}}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn{min-height:38px;flex-shrink:0;max-width:100%}
.btn:hover{border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.btn-lg{padding:11px 18px;min-height:46px;font-size:1rem}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.88rem;min-height:32px}
.btn.ghost.sm{min-height:32px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip:active{transform:translateY(1px)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mark{background:var(--mark);color:var(--mark-ink)}

label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{
  border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.93rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:none}
.li .grow{flex:1;min-width:0}
.bar{height:10px;background:var(--grid);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.mark>i{background:var(--mark)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;background:var(--paper)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.scrollx{overflow-x:auto}
.pre{white-space:pre-wrap;font-size:.92rem;max-height:340px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
details>summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:99;max-width:min(92vw,520px);font-weight:700;box-shadow:var(--shadow)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

/* Symbole */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip .ic{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}

/* Startseite */
.home{gap:30px}
.view>section,.view>div{scroll-margin-top:120px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:38px}
.sec-head h2{font-size:1.25rem}
.hero{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;justify-content:space-between}
.hero h1{font-size:clamp(1.8rem,4vw,2.5rem)}
.hero p{max-width:60ch}
.intro{gap:16px;padding:22px}
.intro h2{font-size:1.3rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;counter-reset:st}
.steps li{display:flex;flex-direction:column;gap:3px;padding:14px 14px 14px 52px;border:1px solid var(--line);border-radius:12px;background:var(--paper);position:relative;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.set-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);box-shadow:var(--shadow);min-width:0}
.set-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.set-name{font-size:1.08rem;overflow-wrap:anywhere}
.set-next{font-weight:700}
.cur-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.cur-set b{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
@media (min-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);min-height:208px;min-width:0;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.tile:active{background:var(--accent-soft)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile[aria-busy="true"]{cursor:progress;opacity:.8}
.tile-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.tile-ic .ic{width:26px;height:26px}
.tile-t{font-family:var(--f-display);font-weight:700;font-size:1.16rem;line-height:1.2}
.tile-d{color:var(--muted);font-size:.95rem}
.tile-s{font-size:.86rem;font-weight:700}
.tile-s.warn{color:var(--warn)}
.tile-s.warn::before{content:"! ";}
.tile-cta{margin-top:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:40px}
.tile-cta .ic{width:18px;height:18px}
.tile:hover .tile-cta{filter:brightness(1.08)}
@media (max-width:560px){.tile{min-height:0;display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:14px;row-gap:4px}.tile>*{grid-column:2}.tile-ic{grid-column:1;grid-row:1/span 3;margin:0}.tile-cta{justify-self:start;margin-top:6px}}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.org-tile{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;color:var(--ink);min-height:68px;box-shadow:var(--shadow)}
.org-tile>.ic{width:28px;height:28px;color:var(--accent)}
.org-tile:hover{border-color:var(--accent)}
.org-tile:active{background:var(--accent-soft)}
.li-now{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
/* Lernset auswählen */
.pick-list{display:flex;flex-direction:column;gap:8px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;color:var(--ink);min-height:56px}
.pick:hover{border-color:var(--accent)}
.pick[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick b{overflow-wrap:anywhere}
.pick>.ic{width:18px;height:18px;color:var(--muted)}
/* Lernset-Leiste in den Lernansichten */
.modebar{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.modebar-set{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0}
.modebar-k{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modebar-n{font-family:var(--f-display);font-size:1.1rem;overflow-wrap:anywhere}
.modebar-modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.modebar-modes .chip{white-space:nowrap;min-height:36px}
.modebar-modes .chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Quiz */
.q-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-prompt{font-size:1.15rem;font-weight:700;line-height:1.4}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sheet);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.feedback{border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.quote{border-left:3px solid var(--mark);padding:4px 10px;font-style:italic;background:var(--sheet);border-radius:0 6px 6px 0}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:520px){.match-row{grid-template-columns:1fr}}
.cloze input{display:inline-block;width:auto;min-width:8ch;max-width:100%;padding:3px 8px;margin:2px}
.cloze input.right{border-color:var(--ok);background:var(--ok-soft)}
.cloze input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.03em}
.why{border-top:1px dashed var(--line);padding-top:8px}
.why-a{margin:0;white-space:pre-line}
.exam-head{position:sticky;top:0;z-index:5}
.exam-clock{font-size:2rem}
.exam-clock.low{color:var(--bad)}
@media (max-width:600px){.exam-head h1{font-size:1.3rem}.exam-head>p.small{display:none}.exam-clock{font-size:1.5rem}}
table.t{border-collapse:collapse;width:100%;font-size:.94rem}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n{font-family:var(--f-mono);text-align:right}

/* Stundenplan */
.tt{display:grid;gap:4px;min-width:640px}
.tt .h{font-weight:700;font-size:.85rem;text-align:center;padding:4px;color:var(--muted)}
.tt .time{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding:6px 4px;text-align:right;line-height:1.25}
.tt .cell{min-height:54px;border:1px dashed var(--line);border-radius:7px;background:var(--paper);cursor:pointer;padding:5px 6px;font-size:.82rem;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.tt .cell.filled{border-style:solid;border-color:transparent;background:var(--c,var(--accent-soft))}
.tt .cell b{font-size:.86rem;overflow-wrap:anywhere;color:var(--ink)}
.tt .cell span{color:var(--muted);font-size:.74rem}
.tt .cell.now{outline:2px solid var(--accent)}
.daycol{display:flex;flex-direction:column;gap:6px}

/* Termine */
.due{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 4px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.due b{font-family:var(--f-display);font-size:1.35rem;line-height:1}
.due span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.plan-day{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.plan-day.today{background:var(--mark);color:var(--mark-ink);border-radius:8px;padding-inline:8px}
.plan-day.today .muted{color:var(--mark-ink)}
.plan-day.done .what{text-decoration:line-through;opacity:.6}
@media (max-width:520px){.plan-day{grid-template-columns:1fr auto}.plan-day .d{grid-column:1/-1}}

/* Bibliothek */

/* Karteikarten */

<script>
/* ---- 02_data.js ---- */
/* ===================== Kataloge: Bundesländer, Schularten, Fächer, Themen, Studiengänge ===================== */
const STATES = [
  {k:"BW",n:"Baden-Württemberg",url:"https://www.bildungsplaene-bw.de/",src:"Bildungsplan 2016 (KM / ZSL Baden-Württemberg)",deep:true},
  {k:"BY",n:"Bayern",url:"https://www.lehrplanplus.bayern.de/",src:"LehrplanPLUS (ISB Bayern)",deep:true},
  {k:"BE",n:"Berlin",url:"https://bildungsserver.berlin-brandenburg.de/rlp-online/",src:"Rahmenlehrplan Berlin-Brandenburg"},
  {k:"BB",n:"Brandenburg",url:"https://bildungsserver.berlin-brandenburg.de/rlp-online/",src:"Rahmenlehrplan Berlin-Brandenburg"},
  {k:"HB",n:"Bremen",url:"https://www.lis.bremen.de/schulqualitaet/curriculumentwicklung/bildungsplaene-15219",src:"Bildungspläne Bremen (LIS)"},
  {k:"HH",n:"Hamburg",url:"https://www.hamburg.de/bsfb/bildungsplaene",src:"Bildungspläne Hamburg"},
  {k:"HE",n:"Hessen",url:"https://kultus.hessen.de/unterricht/kerncurricula-und-lehrplaene/kerncurricula",src:"Kerncurricula Hessen (Kultusministerium)",deep:true},
  {k:"MV",n:"Mecklenburg-Vorpommern",url:"https://www.bildung-mv.de/",src:"Rahmenpläne MV (Bildungsserver)"},
  {k:"NI",n:"Niedersachsen",url:"https://cuvo.nibis.de/",src:"Kerncurricula Niedersachsen (NiBiS)"},
  {k:"NW",n:"Nordrhein-Westfalen",url:"https://lehrplannavigator.nrw.de/",src:"Kernlehrpläne NRW (QUA-LiS, Lehrplannavigator)",deep:true},
  {k:"RP",n:"Rheinland-Pfalz",url:"https://lehrplaene.bildung-rp.de/",src:"Lehrpläne Rheinland-Pfalz"},
  {k:"SL",n:"Saarland",url:"https://www.saarland.de/mbk/DE/portale/bildungsserver/home/home_node.html",src:"Lehrpläne Saarland (Bildungsserver)"},
  {k:"SN",n:"Sachsen",url:"https://www.schulportal.sachsen.de/lplandb/",src:"Lehrplandatenbank Sachsen"},
  {k:"ST",n:"Sachsen-Anhalt",url:"https://lisa.sachsen-anhalt.de/unterricht/lehrplaene-rahmenrichtlinien",src:"Lehrpläne Sachsen-Anhalt (LISA)"},
  {k:"SH",n:"Schleswig-Holstein",url:"https://fachportal.lernnetz.de/",src:"Fachanforderungen Schleswig-Holstein"},
  {k:"TH",n:"Thüringen",url:"https://www.schulportal-thueringen.de/lehrplaene",src:"Lehrpläne Thüringen (Schulportal)"},
];
const stateByK = k => STATES.find(s=>s.k===k);

/* Offizielle Einstiegsseiten je Land + Schulart (wo bekannt) */
const PLAN_LINKS = {
  BW:{grund:"https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/GS",haupt:"https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/SEK1",real:"https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/SEK1",gms:"https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/SEK1",gym:"https://www.bildungsplaene-bw.de/,Lde/LS/BP2016BW/ALLG/GYM",bg:"https://www.ls-bw.de/,Lde/Startseite/schulartuebergreifend/bildungsplaene-berufliche-schulen"},
  BY:{grund:"https://www.lehrplanplus.bayern.de/schulart/grundschule",haupt:"https://www.lehrplanplus.bayern.de/schulart/mittelschule",real:"https://www.lehrplanplus.bayern.de/schulart/realschule",gym:"https://www.lehrplanplus.bayern.de/schulart/gymnasium",fos:"https://www.lehrplanplus.bayern.de/schulart/fachoberschule",bs:"https://www.lehrplanplus.bayern.de/schulart/berufsschule"},
  NW:{grund:"https://lehrplannavigator.nrw.de/grundschule",haupt:"https://lehrplannavigator.nrw.de/sekundarstufe-i",real:"https://lehrplannavigator.nrw.de/sekundarstufe-i",gms:"https://lehrplannavigator.nrw.de/sekundarstufe-i",gym:"https://lehrplannavigator.nrw.de/sekundarstufe-i",os:"https://lehrplannavigator.nrw.de/sekundarstufe-ii",bs:"https://www.berufsbildung.nrw.de/"},
  HE:{grund:"https://kultusministerium.hessen.de/Unterricht/Kerncurricula-Primarstufe",haupt:"https://kultusministerium.hessen.de/Unterricht/Sekundarstufe-I-Kerncurricula",real:"https://kultusministerium.hessen.de/Unterricht/Sekundarstufe-I-Kerncurricula",gms:"https://kultusministerium.hessen.de/Unterricht/Sekundarstufe-I-Kerncurricula",gym:"https://kultusministerium.hessen.de/Unterricht/Sekundarstufe-I-Kerncurricula",os:"https://kultus.hessen.de/unterricht/kerncurricula-und-lehrplaene/kerncurricula/gymnasiale-oberstufe-ab-schuljahr-20242025-kerncurricula",bg:"https://kultus.hessen.de/unterricht/kerncurricula-und-lehrplaene/kerncurricula/berufliches-gymnasium-ab-schuljahr-202425-kerncurricula",fos:"https://kultusministerium.hessen.de/unterricht/kerncurricula-und-lehrplaene/kerncurricula/fachoberschule"},
};

/* Schularten; Bezeichnungen je Land */
const SCHOOL_TYPES = [
  {k:"grund",n:"Grundschule",grades:[1,2,3,4]},
  {k:"haupt",n:"Hauptschule",grades:[5,6,7,8,9,10]},
  {k:"real",n:"Realschule",grades:[5,6,7,8,9,10]},
  {k:"gms",n:"Gesamt- / Gemeinschaftsschule",grades:[5,6,7,8,9,10,11,12,13]},
  {k:"gym",n:"Gymnasium",grades:[5,6,7,8,9,10,11,12,13]},
  {k:"ws",n:"Wirtschaftsschule",grades:[6,7,8,9,10,11],only:["BY"]},
  {k:"bg",n:"Berufliches Gymnasium",grades:[11,12,13]},
  {k:"fos",n:"Fachoberschule / Berufsoberschule",grades:[11,12,13]},
  {k:"bs",n:"Berufsschule (Ausbildung)",grades:[1,2,3,4],gradeLabel:"Ausbildungsjahr"},
];
function schoolTypeName(k,state){
  const L={
    haupt:{BW:"Werkrealschule / Hauptschule",BY:"Mittelschule",NW:"Hauptschule",HE:"Hauptschule",SN:"Oberschule",TH:"Regelschule",BE:"Integrierte Sekundarschule",HH:"Stadtteilschule"},
    real:{SN:"Oberschule",TH:"Regelschule",BE:"Integrierte Sekundarschule",HH:"Stadtteilschule",RP:"Realschule plus",SL:"Gemeinschaftsschule"},
    gms:{BW:"Gemeinschaftsschule",NW:"Gesamtschule / Sekundarschule",HE:"Integrierte Gesamtschule",BY:"Gesamtschule (Schulversuch)",NI:"Integrierte Gesamtschule",SH:"Gemeinschaftsschule",HH:"Stadtteilschule",BE:"Integrierte Sekundarschule"},
    fos:{BY:"FOS / BOS",BW:"Berufskolleg / Berufsoberschule",NW:"Berufskolleg (Fachoberschule)"},
    bg:{BY:"Berufliches Gymnasium (nicht in Bayern – siehe FOS/BOS)",NW:"Berufliches Gymnasium (Berufskolleg)"},
  };
  return (L[k]&&L[k][state]) || (SCHOOL_TYPES.find(t=>t.k===k)||{}).n || k;
}
function gradesFor(type,state){
  const t=SCHOOL_TYPES.find(x=>x.k===type); if(!t) return [];
  if(type==="grund" && (state==="BE"||state==="BB")) return [1,2,3,4,5,6];
  if(type==="gym" && (state==="SN"||state==="TH"||state==="ST"||state==="MV"||state==="SL"||state==="HB"||state==="HH"||state==="BE"||state==="BB")) return [5,6,7,8,9,10,11,12].filter(g=>!(g<7&&(state==="BE"||state==="BB")));
  if(type==="haupt" && state==="BY") return [5,6,7,8,9,10];
  if(type==="real" && state==="BY") return [5,6,7,8,9,10];
  return t.grades;
}
function planLink(p){
  const s=stateByK(p.state); const l=PLAN_LINKS[p.state]||{};
  const os = (p.type==="gym"||p.type==="gms") && p.grade>=11;
  return {url:(os&&l.os)||l[p.type]||(s&&s.url)||"https://www.kmk.org/themen/qualitaetssicherung-in-schulen/bildungsstandards.html", src:s?s.src:"Bildungsstandards der KMK"};
}

/* Fächer-Normalisierung (gemeinsamer Schlüssel in der Bibliothek) */
function subjKey(name){return String(name||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"fach";}

/* Fächer je Land, Schulart, Stufe. core = vorausgewählt */
function subjectsFor(p){
  const st=p.state, t=p.type, g=Number(p.grade)||0;
  const out=[]; const add=(n,core=false,topic=null)=>{ if(!out.find(x=>x.n===n)) out.push({n,core,topicKey:topic||n}); };
  const relig = st==="BY"?["Katholische Religionslehre","Evangelische Religionslehre","Ethik"]: st==="NW"?["Katholische Religionslehre","Evangelische Religionslehre","Praktische Philosophie"]: ["Katholische Religion","Evangelische Religion","Ethik"];
  const geo = (st==="NW"||st==="HE"||st==="RP"||st==="SL"||st==="NI"||st==="HB")?"Erdkunde":"Geographie";
  const pol = {BW:"Gemeinschaftskunde",BY:"Politik und Gesellschaft",NW:"Wirtschaft-Politik",HE:"Politik und Wirtschaft",NI:"Politik-Wirtschaft",SN:"Gemeinschaftskunde/Rechtserziehung/Wirtschaft",TH:"Sozialkunde",ST:"Sozialkunde",RP:"Sozialkunde",SL:"Politik",BE:"Politische Bildung",BB:"Politische Bildung",HH:"PGW (Politik/Gesellschaft/Wirtschaft)",HB:"Politik",SH:"Wirtschaft/Politik",MV:"Sozialkunde"}[st]||"Politik";
  if(t==="grund"){
    add("Deutsch",true); add("Mathematik",true);
    add(st==="BY"?"Heimat- und Sachunterricht":"Sachunterricht",true,"Sachunterricht");
    if(g>=3 || st==="NW" || st==="HE" || st==="BW") add("Englisch",g>=3);
    add("Kunst"); add("Musik"); add("Sport"); relig.forEach(r=>add(r)); if(st==="BY") add("Werken und Gestalten");
    return out;
  }
  const os = ["gym","gms","bg","fos"].includes(t) && g>=11;
  if(t==="bs"){
    ["Deutsch","Englisch","Wirtschafts- und Sozialkunde","Politik / Gemeinschaftskunde","Lernfelder (Fachtheorie)","Fachpraxis","Mathematik / Fachrechnen","Religion / Ethik","Sport"].forEach((n,i)=>add(n,i<4));
    return out;
  }
  add("Deutsch",true); add("Mathematik",true); add("Englisch",true);
  if(t==="gym"||(t==="gms"&&g>=6)||t==="bg"){ add("Französisch",g>=6&&t==="gym"&&!os); add("Latein"); add("Spanisch"); }
  if(t==="real"&&st==="BW"&&g>=6) add("Französisch");
  if(t==="real"&&st==="BY"&&g>=6) add("Französisch");
  if(os){
    ["Biologie","Chemie","Physik","Informatik","Geschichte",geo,pol,"Wirtschaft","Philosophie","Psychologie","Pädagogik","Kunst","Musik","Sport"].forEach(n=>add(n, ["Biologie","Geschichte"].includes(n)));
    if(st==="BW") { add("Literatur und Theater"); add("NwT (Naturwissenschaft und Technik)"); }
    if(st==="BY") { add("Wirtschaft und Recht"); }
    if(t==="bg"){ add("Profilfach (z. B. Wirtschaft, Technik, Ernährung, Soziales)",true); add("Volks- und Betriebswirtschaftslehre"); add("Technik"); }
    if(t==="fos"){ add("Profilfach / Fachrichtung (z. B. Technik, Wirtschaft, Sozialwesen)",true); add("Betriebswirtschaftslehre mit Rechnungswesen"); add("Technologie"); }
    relig.forEach(r=>add(r)); return out;
  }
  // Sekundarstufe I
  if(g<=6 || (st==="BY" && g<=7)){
    if(st==="BW") add("BNT (Biologie, Naturphänomene und Technik)",true,"Biologie");
    else if(st==="BY") add("Natur und Technik",true,"Biologie");
    else add(t==="gms"&&st==="NW"?"Naturwissenschaften":"Biologie",true,"Biologie");
  }
  const msBY = st==="BY"&&t==="haupt";
  if(!msBY){
    if(g>=7 || st!=="BW") add("Biologie",g>=7);
    if(g>=7) add("Physik",true);
    if(g>=8 || (st==="NW"&&g>=7)) add("Chemie",true);
  } else if(g>=8) add("Natur und Technik",true,"Biologie");
  const nwGe = t==="gms"&&st==="NW";
  if(nwGe){ add("Gesellschaftslehre",true,"Geschichte"); add("Arbeitslehre"); }
  if(st==="BY"&&t==="haupt"){ add("Geschichte/Politik/Geographie",true,"Geschichte"); add("Wirtschaft und Beruf",true); add("Technik"); add("Ernährung und Soziales"); add("Wirtschaft und Kommunikation"); }
  else if(!nwGe) { add("Geschichte",g>=6); add(geo,true,"Geographie"); if(g>=7||st==="NW"||st==="HE") add(pol,g>=8,"Politik"); }
  if(st==="BW"&&g>=7) add("Wirtschaft / Berufs- und Studienorientierung (WBS)",g>=8,"Wirtschaft");
  if(st==="BY"&&(t==="gym"||t==="real")&&g>=8) add(t==="real"?"Betriebswirtschaftslehre/Rechnungswesen (BwR)":"Wirtschaft und Recht",g>=9,"Wirtschaft");
  if(st==="BW"&&t==="gym"&&g>=8) { add("Profilfach NwT",false,"Physik"); add("Profilfach IMP (Informatik, Mathematik, Physik)",false,"Informatik"); }
  if(st==="HE"&&t!=="gym") add("Arbeitslehre");
  if(st==="BW"&&(t==="real"||t==="gms"||t==="haupt")&&g>=7){ add("Technik"); add("AES (Alltagskultur, Ernährung, Soziales)"); }
  add("Informatik",(st==="NW"&&g<=6)||(st==="BY"&&t==="gym"&&g>=6&&g<=7)); add("Kunst"); add("Musik"); add("Sport");
  relig.forEach(r=>add(r));
  return out;
}

/* Schlüssel für Themenbänder */
function topicBand(p){
  if(!p||p.track!=="schule") return null;
  if(p.type==="grund") return "gs";
  const g=Number(p.grade)||0;
  if(p.type==="bs") return "os";
  if(g>=11) return "os"; if(g>=9) return "9-10"; if(g>=7) return "7-8"; return "5-6";
}
function topicAlias(subject){
  const s=subject.toLowerCase();
  if(s.includes("mathe")) return "Mathematik";
  if(s.startsWith("deutsch")) return "Deutsch";
  if(s.startsWith("englisch")) return "Englisch";
  if(s.includes("biolog")||s.startsWith("bnt")||s.includes("natur und technik")||s==="naturwissenschaften") return "Biologie";
  if(s.startsWith("chemie")) return "Chemie";
  if(s.startsWith("physik")||s.includes("nwt")) return "Physik";
  if(s.startsWith("geschicht")||s.startsWith("gesellschaftslehre")) return "Geschichte";
  if(s.startsWith("geograph")||s.startsWith("erdkunde")) return "Geographie";
  if(s.includes("politik")||s.includes("gemeinschaftskunde")||s.includes("sozialkunde")||s.startsWith("pgw")) return "Politik";
  if(s.includes("wirtschaft")||s.includes("wbs")||s.includes("bwr")) return "Wirtschaft";
  if(s.includes("informatik")||s.startsWith("profilfach imp")) return "Informatik";
  if(s.includes("sachunterricht")) return "Sachunterricht";
  if(s.startsWith("franz")) return "Französisch";
  if(s.startsWith("latein")) return "Latein";
  return null;
}

/* ===================== Bildungspläne: passende Pläne zu Profil, Fach und Thema ===================== */
/* Die Daten (data/bildungsplaene.js, ca. 1 MB) lädt Merkwerk erst, wenn sie gebraucht werden. */
const PLAN_SRC="bildungsplaene.js";
const PLAN_STATUS={g:"gültig",a:"gültig, wird aufsteigend eingeführt",x:"auslaufend, gilt noch für höhere Jahrgänge",s:"gilt subsidiär weiter",k:"tritt erst künftig in Kraft",e:"Erprobungsfassung",n:"nicht verifiziert",p:"Portalübersicht"};
const PLAN_RANK={g:0,a:0,e:1,s:2,n:3,x:4,k:5,p:6};
let PLAN_ROWS=null;
function planRows(){
  if(PLAN_ROWS) return PLAN_ROWS;
  const D=(typeof window!=="undefined"&&window.PLAN_DB)||null; if(!D) return null;
  PLAN_ROWS=D.rows.map(r=>({land:r[0],types:D.types[r[1]].split(","),art:D.arten[r[2]],lo:r[3],hi:r[4],fach:D.faecher[r[5]],title:r[6],url:D.pre[r[7]]+r[8],st:r[9],gen:!!r[10],valid:r[11]||""}));
  return PLAN_ROWS;
}
let planLoading=null;
async function loadPlans(){
  if(planRows()) return true;
  planLoading ||= loadScript(PLAN_SRC).then(()=>!!planRows()).catch(()=>{ planLoading=null; return false; });
  return planLoading;
}
// Alle Pläne für Land, Schulart und Klasse
function plansFor(p){
  const rows=planRows(); if(!rows||!p||p.track!=="schule"||!p.state||!p.type) return [];
  const g=Number(p.grade)||0;
  return rows.filter(r=>r.land===p.state&&r.types.includes(p.type)&&(p.type==="bs"||!g||(g>=r.lo&&g<=r.hi)))
    .sort((a,b)=>(PLAN_RANK[a.st]??9)-(PLAN_RANK[b.st]??9));
}
// Fächer laut Bildungsplan: [{n, docs}]
function planSubjects(p){
  const m=new Map();
  for(const r of plansFor(p)){ if(r.gen||!r.fach||r.st==="p") continue; const k=subjKey(r.fach); if(!m.has(k)) m.set(k,{n:r.fach,docs:0}); m.get(k).docs++; }
  return [...m.values()].sort((a,b)=>a.n.localeCompare(b.n,"de"));
}
// Passt ein Planfach zu einem Fachnamen des Nutzers? (gleicher Name oder dasselbe Kernfach unter anderem Namen)
function sameSubject(planFach,name){
  const a=subjKey(planFach), b=subjKey(name); if(!a||!b) return false;
  if(a===b) return true;
  if(/,| als |zweitsprache|herkunft|profil|gebärden|\(nwt\)/i.test(planFach)) return false; // z. B. „Deutsch als Zweitsprache“, „Informatik, Mathematik, Physik (IMP)“
  const ta=topicAlias(planFach), tb=topicAlias(name); return !!(ta&&tb&&ta===tb&&(a===subjKey(ta)||b===subjKey(ta)));
}
// Pläne zu einem Fach: {docs: Fachpläne, general: übergreifende Teile}
function plansForSubject(p,subject){
  const all=plansFor(p);
  return { docs:all.filter(r=>!r.gen&&r.fach&&sameSubject(r.fach,subject)), general:all.filter(r=>r.gen).slice(0,4) };
}
// Fächerliste für die Profil-Abfrage: Fächer laut Bildungsplan, Kernfächer (aus subjectsFor) vorausgewählt
function subjectOptions(p){
  const base=subjectsFor(p); const fromPlan=planSubjects(p);
  if(!fromPlan.length) return base;
  const out=fromPlan.map(s=>({n:s.n,core:base.some(b=>b.core&&sameSubject(s.n,b.n)),plan:true}));
  return out.sort((a,b)=>(b.core-a.core)||a.n.localeCompare(b.n,"de"));
}
function planDocHTML(r){
  return `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a>${r.st!=="g"?` <span class="small muted">· ${esc(PLAN_STATUS[r.st]||"")}</span>`:""}`;
}

/* ===================== Beispiel: Photosynthese (selbst geschrieben, als Beispiel gekennzeichnet) ===================== */
const EXAMPLE_TEXT = `Photosynthese – Grundlagen

Die Photosynthese ist der Prozess, bei dem grüne Pflanzen, Algen und Cyanobakterien Lichtenergie in chemische Energie umwandeln. Aus Kohlenstoffdioxid und Wasser entstehen dabei Glucose und Sauerstoff. Die vereinfachte Summengleichung lautet: 6 CO2 + 6 H2O → C6H12O6 + 6 O2.

Ort der Photosynthese

Die Photosynthese findet in den Chloroplasten statt. Chloroplasten sind von einer Doppelmembran umgeben. Im Inneren liegen gestapelte Membransäckchen, die Thylakoide, umgeben von einer Grundsubstanz, dem Stroma. Der grüne Farbstoff Chlorophyll sitzt in den Thylakoidmembranen und absorbiert vor allem rotes und blaues Licht. Grünes Licht wird größtenteils reflektiert, deshalb erscheinen Blätter grün.

Lichtabhängige Reaktionen

Die lichtabhängigen Reaktionen laufen an den Thylakoidmembranen ab. Dort wird Wasser unter Lichteinwirkung gespalten; diesen Vorgang nennt man Fotolyse. Der dabei frei werdende Sauerstoff stammt also aus dem Wasser und nicht aus dem Kohlenstoffdioxid. Die Energie des Lichts wird in Form von ATP und NADPH gespeichert, die anschließend für den Aufbau von Zucker gebraucht werden.

Lichtunabhängige Reaktionen (Calvin-Zyklus)

Im Stroma läuft der Calvin-Zyklus ab. Das Enzym Rubisco bindet dabei Kohlenstoffdioxid an ein Akzeptormolekül. Mithilfe von ATP und NADPH aus den lichtabhängigen Reaktionen wird daraus schrittweise Zucker aufgebaut. Der Calvin-Zyklus braucht kein Licht direkt, ist aber auf die Produkte der lichtabhängigen Reaktionen angewiesen und kommt im Dunkeln deshalb bald zum Erliegen.

Einflussfaktoren

Die Photosyntheserate hängt von der Lichtintensität, der Kohlenstoffdioxid-Konzentration und der Temperatur ab. Steigt die Lichtintensität, nimmt die Rate zunächst zu, bis ein anderer Faktor begrenzt. Dieser Faktor wird als begrenzender Faktor bezeichnet. Bei zu hohen Temperaturen sinkt die Rate wieder, weil Enzyme wie Rubisco ihre Struktur verlieren.

Bedeutung

Die Photosynthese liefert den Sauerstoff, den die meisten Lebewesen zur Zellatmung brauchen. Gleichzeitig bildet die produzierte Glucose die Grundlage fast aller Nahrungsketten. Die Zellatmung kehrt die Summengleichung der Photosynthese im Prinzip um: Glucose und Sauerstoff werden zu Kohlenstoffdioxid und Wasser abgebaut, wobei Energie frei wird.`;

const PROVIDERS = [
  {k:"google",n:"Google"},

];
const providerName = k => (PROVIDERS.find(p=>p.k===k)||{n:k==="claude"?"Claude":k==="local"?"diesem Gerät":k==="guest"?"Gastzugang":k}).n;
const guestAccount = () => ACC.list.find(a=>a.provider==="guest")||null;

/* Kontenliste auf diesem Gerät. Jedes Konto hat eigenen App-Zustand (localStorage) und eigene Lernsets (IndexedDB).
   Daten von vor der Kontenfunktion übernimmt das erste Konto. */
const ACC_KEY="merkwerk.accounts";
const accLoad=()=>{ try{ return JSON.parse(localStorage.getItem(ACC_KEY))||{list:[],current:null}; }catch{ return {list:[],current:null}; } };
const accStore=a=>{ try{ localStorage.setItem(ACC_KEY,JSON.stringify(a)); }catch{} };
let ACC=accLoad();
const currentAccount=()=>ACC.list.find(a=>a.id===ACC.current)||null;
function storageFor(acc){ return acc ? {ls:acc.ls, db:acc.db} : {ls:"merkwerk.v2", db:"merkwerk"}; }
// Sucht ein Konto über Anbieter und Kennung; legt es sonst an. Liefert {acc, created}.
function upsertAccount(ident){
  let acc=ACC.list.find(a=>a.provider===ident.provider&&a.sub===ident.sub);
  if(acc){ Object.assign(acc,{name:ident.name||acc.name,email:ident.email||acc.email,picture:ident.picture||acc.picture}); ACC.current=acc.id; accStore(ACC); return {acc,created:false}; }
  // Gast („Ohne Konto fortfahren“): eigener Speicherbereich, übernimmt nie die Daten anderer Konten
  if(ident.provider==="guest"){
    acc={id:"gast",provider:"guest",sub:"gast",name:"Gast",email:"",picture:"",createdAt:Date.now(),ls:"merkwerk.v2.gast",db:"merkwerk-gast"};
    ACC.list.push(acc); ACC.current=acc.id; accStore(ACC); return {acc,created:true};
  }
  const id=Math.random().toString(36).slice(2,10);
  const legacyFree=!ACC.list.some(a=>a.db==="merkwerk");
  acc={id,provider:ident.provider,sub:String(ident.sub),name:ident.name||"",email:ident.email||"",picture:ident.picture||"",createdAt:Date.now(),
    ls: legacyFree?"merkwerk.v2":"merkwerk.v2."+id, db: legacyFree?"merkwerk":"merkwerk-"+id};
  ACC.list.push(acc); ACC.current=acc.id; accStore(ACC);
  return {acc,created:true};
}
function signOutAccount(){ ACC.current=null; accStore(ACC); }
function removeAccount(id){ ACC.list=ACC.list.filter(a=>a.id!==id); if(ACC.current===id) ACC.current=null; accStore(ACC); }
// Kennung aus einem JWT (Apple liefert die Identität nur als ID-Token)
function jwtPayload(t){ try{ const p=String(t).split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(p)))); }catch{ return {}; } }

function modal(html,onMount){
  const root=$("#modalRoot"); root.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;

/* ===================== Handschrift und GoodNotes ===================== */
// Handschrift lesen: In claude.ai liest Claude Seitenbilder (auch Handschrift). Ohne Claude (lokal, GitHub Pages)
// übernimmt Tesseract.js im Browser – gut bei gedrucktem Text, bei Handschrift nur eingeschränkt.
// GoodNotes: .goodnotes-Dateien sind ZIP-Archive. GoodNotes legt die eigene Handschrifterkennung
// pro Seite unter search/<Seiten-ID> ab; diesen Text übernimmt Merkwerk. Eingebettete PDFs und Bilder
// (importierte Folien, Fotos) werden wie normale Dateien gelesen.

const FILE_ACCEPT=".pdf,.docx,.txt,.md,.goodnotes,image/*";
const TESSERACT="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js";
const OCR_BY={claude:"von Claude abgeschrieben",browser:"im Browser erkannt",goodnotes:"Handschrift von GoodNotes erkannt"};
const BROWSER_OCR_NOTE="Ohne Claude liest Merkwerk Bilder mit einer Texterkennung im Browser. Gedruckter Text klappt meist gut, Handschrift oft nur teilweise. Prüfe und korrigiere den Text unter „Gelesenen Text ansehen“; in claude.ai liest Claude auch Handschrift.";
const ocrLabel=f=>f&&f.ocr?`${OCR_BY[f.ocrBy]||OCR_BY.claude} – bitte prüfen`:"";

/* ---------- Texterkennung im Browser (ohne Claude) ---------- */
// Tempo: nur das deutsche Sprachmodell (es liest auch englische Wörter; ein zweites Modell kostet fast die doppelte Zeit),
// mehrere Bilder gleichzeitig in eigenen Workern und große Fotos vorher verkleinert.
const OCR_LANG="deu";
const OCR_MAX_SIDE=2400; // längere Bildseite in Pixeln; mehr macht die Erkennung langsamer, aber kaum genauer
// Jeder Worker braucht eigenen Speicher: höchstens drei, auf schwachen Geräten einer
const ocrWorkerCap=()=>(navigator.deviceMemory&&navigator.deviceMemory<4)?1:Math.max(1,Math.min(3,(navigator.hardwareConcurrency||2)-1));
const tessWorkers=[];
function tessWorker(i){
  return tessWorkers[i] ||= loadScript(TESSERACT).then(()=>window.Tesseract.createWorker(OCR_LANG)).catch(e=>{tessWorkers[i]=null;throw e;});
}
async function shrinkForOcr(blob){
  if(typeof createImageBitmap!=="function") return blob;
  let bmp; try{ bmp=await createImageBitmap(blob); }catch{ return blob; }
  const s=OCR_MAX_SIDE/Math.max(bmp.width,bmp.height);
  if(s>=1){ bmp.close&&bmp.close(); return blob; }
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
  return new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",0.92));
}
// items: Bilder oder Funktionen, die ein Bild (oder null für eine leere Seite) liefern – siehe ocrImages
async function ocrLocal(items,progress){
  const n=items.length, out=new Array(n).fill(""); let next=0, done=0;
  const show=()=>progress&&progress(n===1?"Texterkennung im Browser läuft …":`Texterkennung im Browser: ${done} von ${n} Bildern fertig …`);
  progress&&progress("Lade Texterkennung …");
  const lanes=Math.min(n,ocrWorkerCap());
  for(let k=0;k<lanes;k++) tessWorker(k).catch(()=>{}); // alle Worker laden gleichzeitig
  const lane=async k=>{
    let w=null;
    if(k>0){ try{ w=await tessWorker(k); }catch{ return; } } // weitere Worker sind nur Zusatz
    while(next<n){ const i=next++;
      const b=await ocrBlob(items[i]); // Worker 0 lädt, während die erste Seite vorbereitet wird
      if(!w){ w=await tessWorker(0); show(); }
      if(b){ const {data}=await w.recognize(await shrinkForOcr(b)); out[i]=String(data.text||"").replace(/[ \t]+\n/g,"\n").trim(); }
      done++; show();
    }
  };
  await Promise.all(Array.from({length:lanes},(_,k)=>lane(k)));
  return out;
}

/* ---------- ZIP lesen (ohne Bibliothek) ---------- */
async function inflateRaw(u8){
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzipIndex(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error("kein ZIP-Archiv");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const dec=new TextDecoder(); const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("ZIP-Verzeichnis beschädigt");
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const start=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    files[name]={method,raw:u8.subarray(start,start+csize)};
    p+=46+nl+xl+cl;
  }
  return files;
}
async function zipRead(entry){
  if(!entry) return null;
  if(entry.method===0) return entry.raw;
  if(entry.method===8) return inflateRaw(entry.raw);
  throw new Error("ZIP-Kompression wird nicht unterstützt");
}

/* ---------- Protobuf ohne Schema ---------- */
function pbFields(u8){
  const out=[]; let i=0;
  const varint=()=>{ let r=0,m=1,b; do{ if(i>=u8.length) throw 0; b=u8[i++]; r+=(b&127)*m; m*=128; }while(b&128); return r; };
  while(i<u8.length){
    const key=varint(), f=Math.floor(key/8), t=key%8; let v;
    if(f<1) throw 0;
    if(t===0) v=varint(); else if(t===1){ v=null; i+=8; } else if(t===5){ v=null; i+=4; }
    else if(t===2){ const L=varint(); if(i+L>u8.length) throw 0; v=u8.subarray(i,i+L); i+=L; }
    else throw 0;
    out.push([f,t,v]);
  }
  return out;
}
const pbTry=u8=>{ try{ return pbFields(u8); }catch{ return null; } };
function pbDelimited(u8){ // Folge von Datensätzen mit vorangestellter Länge
  const out=[]; let i=0;
  while(i<u8.length){ let L=0,m=1,b; do{ b=u8[i++]; L+=(b&127)*m; m*=128; }while(b&128 && i<u8.length); out.push(u8.subarray(i,i+L)); i+=L; }
  return out;
}
const utf8=u8=>new TextDecoder().decode(u8);

/* ---------- GoodNotes ---------- */
// Erkannter Text einer Seite: Feld 6 = Wort/Zeichen, darin Feld 3 = Kandidaten (der erste ist der beste)
function goodnotesSearchText(u8){
  const top=pbTry(u8); if(!top) return "";
  let s="";
  for(const [f,t,v] of top){
    if(f!==6||t!==2) continue;
    const tok=pbTry(v); if(!tok) continue;
    const c=tok.find(([ff,tt])=>ff===3&&tt===2);
    if(c) s+=utf8(c[2]);
  }
  return s.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function sniff(u8){
  const h=String.fromCharCode(...u8.subarray(0,8));
  if(h.startsWith("%PDF")) return "pdf";
  if(u8[0]===0x89&&h.slice(1,4)==="PNG") return "png";
  if(u8[0]===0xff&&u8[1]===0xd8) return "jpeg";
  return "";
}
async function readGoodnotes(file,progress,readPdf,ocrImagesFn){
  const name=file.name; let files;
  try{ files=unzipIndex(new Uint8Array(await file.arrayBuffer())); }
  catch{ throw new Error(`„${name}“: Diese GoodNotes-Datei lässt sich nicht öffnen. Exportiere die Notizen in GoodNotes als PDF (Teilen → Exportieren → PDF) und lade das PDF hoch.`); }
  progress&&progress(`Lese GoodNotes-Notizen ${name} …`);
  // Seiten in der Reihenfolge des Notizbuchs
  const ids=[]; const idxRaw=await zipRead(files["index.notes.pb"]).catch(()=>null);
  if(idxRaw) for(const rec of pbDelimited(idxRaw)){ const fs=pbTry(rec); const id=fs&&fs.find(([f,t])=>f===1&&t===2); if(id){ const s=utf8(id[2]); if(!ids.includes(s)) ids.push(s); } }
  for(const k of Object.keys(files)){ const m=k.match(/^notes\/(.+)$/); if(m&&!ids.includes(m[1])) ids.push(m[1]); }
  const parts=[]; let hand=0;
  for(const id of ids){
    const raw=await zipRead(files["search/"+id]).catch(()=>null);
    const t=raw?goodnotesSearchText(raw):"";
    if(t){ parts.push(t); hand++; }
  }
  // Eingebettete PDFs (importierte Folien, Arbeitsblätter) nur mit Textebene – sonst ist es meist das Papier (Linien, Karos)
  // und die Handschrift darauf steckt schon in search/. Eingebettete Bilder (Fotos, Screenshots) werden gelesen.
  const imgs=[]; let by=hand?"goodnotes":""; let ocrUsed=hand>0;
  for(const k of Object.keys(files).filter(k=>k.startsWith("attachments/"))){
    const raw=await zipRead(files[k]).catch(()=>null); if(!raw) continue;
    const kind=sniff(raw);
    if(kind==="pdf"){ try{ const r=await readPdf(raw,name,progress,{textOnly:true}); if(r.text.trim()){ parts.push(r.text); if(r.ocr){ ocrUsed=true; by=by||r.ocrBy; } } }catch{} }
    else if(kind==="png"||kind==="jpeg"){ if(raw.length>20000) imgs.push(new Blob([raw],{type:"image/"+kind})); }
  }
  if(imgs.length){
    try{ const r=await ocrImagesFn(imgs,progress); const t=r.texts.filter(Boolean).join("\n\n"); if(t.trim()){ parts.push(t); ocrUsed=true; by=by||r.by; } }catch{}
  }
  const text=parts.join("\n\n").trim();
  if(!text) throw new Error(`„${name}“: In dieser GoodNotes-Datei wurde kein Text gefunden. Wahrscheinlich hat GoodNotes die Handschrift noch nicht erkannt. Exportiere die Notizen als PDF und lade das PDF hoch – ${CAP.sample?"Claude":"die Texterkennung"} liest dann die Seiten.`);
  return {text,ocr:ocrUsed,ocrBy:by||"goodnotes",kind:"goodnotes"};
}

/* ===================== KI außerhalb von claude.ai (eigener Server mit Supabase) ===================== */
/* Wenn die Seite nicht in claude.ai läuft (GitHub Pages, lokal), fragt Merkwerk Claude über die eigene
   Supabase Edge Function „merkwerk-ai“. Sie hat dieselbe Schnittstelle wie claude.ais sample, damit der
   Rest der App nichts davon merkt. Leer = nicht eingerichtet; dann bleibt es bei der Variante ohne KI.
   Einrichtung: docs/ki-fuer-alle.md */
const AI_CONFIG = {
  url: "",      // Supabase → Project Settings → API → Project URL, z. B. https://abcd1234.supabase.co
  anonKey: "",  // Supabase → Project Settings → API → anon public key (darf öffentlich sein)
};
const aiReady=()=>!!(AI_CONFIG.url&&AI_CONFIG.anonKey);
const AI_SESSION_KEY="merkwerk.ki.sitzung";
const AI_CONSENT_KEY="merkwerk.ki.einwilligung";
const aiErr=(code,msg)=>Object.assign(new Error(msg||code),{code});

// Anonymes Supabase-Konto pro Gerät: kein Formular, nur ein Zugangs-Token, an dem das Tageslimit hängt.
async function aiToken(force){
  const base=AI_CONFIG.url.replace(/\/+$/,"");
  const h={apikey:AI_CONFIG.anonKey,"Content-Type":"application/json"};
  let s=lsGet(AI_SESSION_KEY,null);
  if(s&&!force&&s.exp>Date.now()+60e3) return s.access;
  let r=null;
  if(s&&s.refresh){ try{ r=await fetch(base+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:h,body:JSON.stringify({refresh_token:s.refresh})}); if(!r.ok) r=null; }catch{ r=null; } }
  if(!r){
    try{ r=await fetch(base+"/auth/v1/signup",{method:"POST",headers:h,body:JSON.stringify({data:{}})}); }catch{ throw aiErr("network"); }
    if(r.status===429) throw aiErr("rate_limited");
    if(!r.ok) throw aiErr("server_error");
  }
  const j=await r.json();
  s={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};
  lsSet(AI_SESSION_KEY,s);
  return s.access;
}

// Einmal pro Gerät: Hinweis, dass Material an Claude (Anthropic) geschickt wird
async function aiConsent(){
  if(lsGet(AI_CONSENT_KEY,false)) return;
  const ok=await new Promise(res=>modal(`<h3>Merkwerk mit KI nutzen</h3>
    <p>Für diese Funktion schickt Merkwerk dein Material (Text oder Bilder) an Claude von Anthropic, damit Claude Fragen erstellt, Bilder liest oder Antworten bewertet. Anthropic verwendet Daten aus solchen Anfragen nicht zum Training seiner Modelle. Pro Tag gibt es eine begrenzte Zahl kostenloser Anfragen.</p>
    <div class="row"><button class="btn primary" id="kiOk">Einverstanden</button><button class="btn" data-close>Abbrechen</button></div>`,
    (m,close)=>{ $("#kiOk",m).onclick=()=>{close();res(true);}; m.querySelector("[data-close]").addEventListener("click",()=>res(false)); }));

// Bilder vor dem Senden auf höchstens 1568 px Kantenlänge verkleinern (mehr nutzt Claude ohnehin nicht)
async function aiImage(blob){
  const type=blob.type||"image/jpeg";
  try{
    const bmp=await createImageBitmap(blob);
    const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));
    if(k<1||!["image/jpeg","image/png","image/webp","image/gif"].includes(type)||blob.size>3.5e6){
      const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
      blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
    }
  }catch{}
  const buf=new Uint8Array(await blob.arrayBuffer()); let bin="";
  for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return {media_type:blob.type||"image/jpeg",data:btoa(bin)};
}

// JSON aus Claudes Antwort lesen (auch wenn Text oder ```json drumherum steht)
function aiParseJson(text){
  const t=String(text||"").replace(/^\s*```(?:json)?\s*/i,"").replace(/\s*```\s*$/,"").trim();
  try{ return JSON.parse(t); }catch{}
  const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch{} }
  throw aiErr("invalid_json");
}

// Gleiche Form wie claude.ai: sample(prompt,{images,modelTier,signal,onText}) → {text}
function remoteSample(){
  const run=async(prompt,opt={})=>{
    await aiConsent();
    const images=opt.images&&opt.images.length?await Promise.all(opt.images.map(aiImage)):[];
    const body=JSON.stringify({prompt,images,tier:opt.modelTier==="quick"?"quick":"default",...(opt.material?{material:opt.material}:{})});
    let res;
    for(let attempt=0;attempt<2;attempt++){
      const token=await aiToken(attempt>0);
      try{ res=await fetch(AI_CONFIG.url.replace(/\/+$/,"")+"/functions/v1/merkwerk-ai",{method:"POST",signal:opt.signal,
        headers:{apikey:AI_CONFIG.anonKey,Authorization:"Bearer "+token,"Content-Type":"application/json"},body}); }
      catch(e){ throw aiErr(e&&e.name==="AbortError"?"cancelled":"network"); }
      if(res.status!==401) break;
    }
    if(!res.ok){ let j={}; try{ j=await res.json(); }catch{} throw aiErr(j.code||(res.status===429?"rate_limited":"server_error"),j.message); }
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf="", done=null;
    try{
      for(;;){
        const {value,done:end}=await rd.read(); if(end) break;
        buf+=dec.decode(value,{stream:true}); let i;
        while((i=buf.indexOf("\n"))>=0){
          const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!line) continue;
          let ev; try{ ev=JSON.parse(line); }catch{ continue; }
          if(ev.t==="text"&&opt.onText) opt.onText({text:ev.text});
          else if(ev.t==="error") throw aiErr(ev.code,ev.message);
          else if(ev.t==="done") done=ev;
        }
      }
    }catch(e){ if(e&&e.name==="AbortError") throw aiErr("cancelled"); throw e; }
    if(!done) throw aiErr("network");
    if(typeof done.rest==="number") CAP.aiRest=done.rest;
    return {text:done.text};
  };
  const sample=(prompt,opt)=>run(prompt,opt);
  sample.json=async(prompt,opt)=>aiParseJson((await run(prompt+"\n\nGib nur das JSON aus, ohne Text davor oder danach.",opt)).text);
  sample.limits=async()=>({images:{maxCount:5}});
  return sample;
}

/* Material (Lernset-Abschnitte) als eigener Block: Der Server schickt es vor der Anweisung und lässt es von der
   Claude API zwischenspeichern (Prompt-Caching). Fragen erstellen, prüfen und Karteikarten nutzen denselben Block,
   so kostet das Material ab der zweiten Anfrage innerhalb von 5 Minuten nur noch etwa ein Zehntel.
   In claude.ai steht das Material wie bisher am Ende der Anfrage. */
function materialText(sections){ return sections.map(s=>`[${s.id} | ${s.fileName}]\n${s.text}`).join("\n\n"); }
function askWithMaterial(prompt,material,opt){
  if(CAP.remote) return CAP.sample.json(prompt,{...opt,material});
  return CAP.sample.json(`${prompt}\n\nMATERIAL\n${material}`,opt);
}

const TYPE_LABEL={mc:"Multiple Choice",text:"Schriftliche Antwort",match:"Zuordnung",cloze:"Lückentext"};
const AFB_LABEL={I:"AFB I · Wiedergeben",II:"AFB II · Zusammenhänge herstellen",III:"AFB III · Anwenden und Beurteilen"};
const BASE_MIX={mc:5,text:4,match:3,cloze:3};
function mixFor(n){ if(n>=15) return {...BASE_MIX}; const k=n/15; const m={mc:Math.max(1,Math.round(5*k)),text:Math.max(1,Math.round(4*k)),match:Math.max(1,Math.round(3*k)),cloze:Math.max(1,Math.round(3*k))}; let s=m.mc+m.text+m.match+m.cloze; while(s>n){ const t=["mc","match","cloze","text"].find(x=>m[x]>1); if(!t)break; m[t]--; s--; } return m; }

/* ---------- Text-Normalisierung für die Zitatprüfung ---------- */
const norm=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/­/g,"");
const relax=s=>norm(s).replace(/ß/g,"ss").replace(/[^a-z0-9äöü]+/g,"");

/* ---------- Abschnitte bilden ---------- */
function makeSections(files){
  const out=[];
  files.forEach((f,fi)=>{
    const paras=String(f.text||"").replace(/\r/g,"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    let buf="";
    const flush=()=>{ if(buf.trim()) out.push({id:"S"+(out.length+1),fileId:f.id,fileName:f.name,text:buf.trim()}); buf=""; };
    for(const p of paras){
      if(p.length>1500){ flush(); const sents=p.split(/(?<=[.!?])\s+/); for(const s of sents){ if((buf+" "+s).length>900) flush(); buf+=(buf?" ":"")+s; } flush(); continue; }
      if(buf && (buf.length+p.length)>900) flush();
      buf+=(buf?"\n\n":"")+p;
      if(buf.length>=420) flush();
    }
    flush();
  });
  return out;
}
function coverageOf(set){ const n=set.sections.length; if(!n) return {pct:0,done:0,n:0}; const done=set.sections.filter(s=>(set.coverage||{})[s.id]>0).length; return {pct:Math.round(done/n*100),done,n}; }
function locateQuote(set,quote){
  const rq=relax(quote); if(rq.length<12) return null;
  for(const f of set.files){ if(relax(f.text).includes(rq)){
      const head=rq.slice(0,40); const secs=set.sections.filter(s=>s.fileId===f.id && (relax(s.text).includes(head)||relax(s.text).includes(rq.slice(-40))));
      return {fileName:f.name,fileId:f.id,sectionIds:secs.map(s=>s.id)}; } }
  return null;
}
/* ---------- Fundstellen: wo steht ein Zitat in seiner Datei? ---------- */
// Nur aus dem, was beim Lesen gespeichert wurde: Seiten bei PDFs, Überschriften und Absätze bei DOCX, Zeilen bei Bildern.
// Lässt sich eine Stelle nicht bestimmen, sagt die Fundstelle das, statt eine Seite zu raten.
function relaxPos(parts,rq){ // in welchem Teil beginnt und endet das Zitat? (Teile aneinandergehängt wie relax(Gesamttext))
  const R=parts.map(relax), all=R.join(""), at=all.indexOf(rq); if(at<0) return null;
  let c=0, a=-1, b=-1; for(let i=0;i<R.length;i++){ const n=c+R[i].length; if(a<0&&at<n) a=i; if(at+rq.length<=n){ b=i; break; } c=n; }
  return {a,b:b<0?R.length-1:b};
}
function quoteWhere(f,quote){
  const rq=relax(quote); if(!f||rq.length<12) return "";
  const head=rq.slice(0,40);
  if(Array.isArray(f.pages)&&f.pages.length){
    const i=f.pages.findIndex(t=>t&&relax(t).includes(head));
    if(i>=0){ const j=f.pages.findIndex((t,k)=>k>=i&&t&&relax(t).includes(rq.slice(-40))); return j>i?`Seite ${i+1}–${j+1}`:`Seite ${i+1}`; }
    return "Seite nicht bestimmbar (Text wurde nachträglich geändert)";
  }
  if(f.kind==="pdf") return "Seite nicht bestimmbar (vor der Seitenerfassung hochgeladen)";
  if(Array.isArray(f.paras)&&f.paras.length){
    const r=relaxPos(f.paras.map(p=>p.t),rq);
    if(r){ const p=f.paras[r.a]; const k=f.paras.slice(0,r.a+1).filter(x=>x.h===p.h).length; return p.h?`Überschrift „${p.h}“, Absatz ${k}`:`Absatz ${r.a+1}`; }
  }
  const text=String(f.text||"");
  if(f.kind==="bild"){
    const lines=text.split("\n"), r=relaxPos(lines,rq); if(!r) return "Bereich nicht bestimmbar";
    const n=lines.length, third=x=>x<n/3?"oberes":x<2*n/3?"mittleres":"unteres";
    return `${r.a===r.b?"Zeile "+(r.a+1):"Zeilen "+(r.a+1)+"–"+(r.b+1)} des erkannten Texts (${third(r.a)} Drittel)`;
  }
  const paras=text.replace(/\r/g,"").split(/\n\s*\n/), r=relaxPos(paras,rq);
  return r?(r.a===r.b?`Absatz ${r.a+1}`:`Absatz ${r.a+1}–${r.b+1}`):"";
}
const fundText=(fileName,where)=>where?`${fileName}, ${where}`:fileName;

/* ---------- Dateien lesen ---------- */
const scriptCache={};
function loadScript(src){ return scriptCache[src] ||= new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Bibliothek konnte nicht geladen werden"));document.head.appendChild(s);}); }
const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFJS_WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const MAMMOTH="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js";

// Liest Bilder (Scans, Fotos, Seiten mit Handschrift). Mit Claude: Claude schreibt ab. Ohne Claude: Texterkennung im Browser.
// Ein Eintrag ist ein Bild oder eine Funktion, die es erst erzeugt (eine PDF-Seite rendern) und null für eine leere Seite liefert –
// so werden spätere Seiten vorbereitet, während die ersten schon gelesen werden.
// Liefert {texts:[ein Text pro Eintrag], by:"claude"|"browser"}.
// Tempo: Claude liest zwei Stapel gleichzeitig (claude.ai lässt pro Person etwa zwei Anfragen parallel laufen) und nimmt
// das schnelle Modell. Mit „Handschrift gründlich lesen“ liest das stärkere Modell, das vorher nachdenkt – genauer, aber langsamer.
const OCR_PARALLEL=2;
const ocrTier=()=>S.ocrThorough?"default":"quick";
const ocrBlob=x=>typeof x==="function"?x():x;
const ocrPrompt=n=>`Du bekommst ${n} Bild(er) von Lernmaterial: Scan, Foto, Screenshot oder handschriftliche Notizen (z. B. aus GoodNotes). Schreibe den gesamten sichtbaren Text exakt und vollständig ab, in Lesereihenfolge – gedruckten Text und Handschrift, auch Randnotizen, Beschriftungen von Pfeilen und Skizzen. Nichts zusammenfassen, nichts ergänzen, nichts korrigieren; Rechtschreibung so übernehmen, wie sie dasteht. Ein Wort, das du nicht sicher lesen kannst, markierst du mit [?]. Tabellen zeilenweise, Formeln als Text. Trenne die Bilder mit einer Zeile "=====". Gib nur den abgeschriebenen Text aus.`;
async function ocrImages(items,progress){
  if(!(CAP.sample&&CAP.images)) return {texts:await ocrLocal(items,progress),by:"browser"};
  const n=items.length, per=Math.max(1,Math.min(CAP.images.maxCount||1,5,Math.ceil(n/OCR_PARALLEL)));
  const starts=[]; for(let i=0;i<n;i+=per) starts.push(i);
  const texts=new Array(n).fill(""), chars=starts.map(()=>0); let next=0, done=0;
  const show=()=>{ const c=chars.reduce((a,b)=>a+b,0); progress&&progress(`Claude liest ${n===1?"das Bild":n+" Seiten"} …${done&&done<n?` ${done} von ${n} fertig`:""}${c?` · ${c.toLocaleString("de-DE")} Zeichen abgeschrieben`:""}`); };
  const ctl=new AbortController(); show();
  const lane=async()=>{
    while(next<starts.length&&!ctl.signal.aborted){ const k=next++, s0=starts[k];
      const got=await Promise.all(items.slice(s0,s0+per).map(ocrBlob));
      const at=[], imgs=[]; got.forEach((b,j)=>{ if(b){ at.push(s0+j); imgs.push(b); } });
      if(imgs.length){
        const {text}=await CAP.sample(ocrPrompt(imgs.length),{images:imgs,modelTier:ocrTier(),signal:ctl.signal,onText:u=>{chars[k]=u.text.length;show();}});
        const ps=text.trim().split(/\n*=====\n*/);
        if(ps.length===imgs.length) ps.forEach((t,j)=>{texts[at[j]]=t.trim();}); else texts[at[0]]=text.trim();
      }
      done+=got.length; show();
    }
  };
  try{ await Promise.all(Array.from({length:Math.min(OCR_PARALLEL,starts.length)},lane)); }
  catch(e){ ctl.abort(); throw e; } // der andere Stapel muss nicht weiterlaufen
  return {texts,by:"claude"};
}
// Leere Seite (z. B. in einem Notizbuch-Export): fast kein dunkler Pixel. Solche Seiten werden nicht gelesen.
function blankCanvas(ctx,w,h){
  try{ const d=ctx.getImageData(0,0,w,h).data; let dark=0;
    for(let i=0;i<d.length;i+=4){ if((d[i]<200||d[i+1]<200||d[i+2]<200)&&++dark>40) return false; }
    return true; }catch{ return false; }
}
// Ab so vielen Vektorpfaden gilt eine PDF-Seite als handschriftlich beschrieben (GoodNotes, Notability, OneNote exportieren Striche als Pfade)
const INK_PATHS=150;
async function readPdf(data,name,progress,opt={}){
  progress&&progress(`Lese ${name} …`); await loadScript(PDFJS);
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  let pdf;
  try{ pdf=await lib.getDocument({data:new Uint8Array(data)}).promise; }
  catch(e){
    if(e&&e.name==="PasswordException") throw new Error(`„${name}“ ist passwortgeschützt. Entferne den Schutz (zum Beispiel über „Drucken als PDF“) und lade die Datei erneut hoch.`);
    throw new Error(`„${name}“ lässt sich nicht öffnen – die Datei ist vermutlich beschädigt oder keine echte PDF. Exportiere sie neu und lade sie erneut hoch.`);
  }
  const claude=!!(CAP.sample&&CAP.images);
  const pages=[]; const scans=[]; let inkOnly=0;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    let t=""; for(const it of tc.items){ t+=it.str+(it.hasEOL?"\n":" "); }
    t=t.replace(/[ \t]+\n/g,"\n").replace(/ {2,}/g," ").trim();
    const empty=t.replace(/\s/g,"").length<25;
    // Seite mit Text und Handschrift: mit Claude die ganze Seite lesen lassen, damit die Handschrift nicht fehlt
    let ink=false;
    if(!empty&&!opt.textOnly){ try{ const ops=await page.getOperatorList(); ink=ops.fnArray.filter(f=>f===lib.OPS.constructPath).length>=INK_PATHS; }catch{} }
    if(opt.textOnly) pages.push(empty?"":t);
    else if(empty||(ink&&claude)){ scans.push({p,page,t,empty}); pages.push(null); }
    else { pages.push(t); if(ink) inkOnly++; }
  }
  // Claude bekommt Bilder ohnehin auf etwa 1,2 Megapixel verkleinert; die Texterkennung im Browser braucht mehr Auflösung
  const render=async s=>{
    const v1=s.page.getViewport({scale:1}); const vp=s.page.getViewport({scale:claude?Math.min(2,Math.sqrt(1.2e6/(v1.width*v1.height))):2.2});
    const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    const ctx=c.getContext("2d",{willReadFrequently:s.empty}); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await s.page.render({canvasContext:ctx,viewport:vp}).promise;
    if(s.empty&&blankCanvas(ctx,c.width,c.height)) return null;
    return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  };
  let ocr=false, ocrBy="";
  if(scans.length){ const r=await ocrImages(scans.map(s=>()=>render(s)),progress); scans.forEach((s,i)=>{pages[s.p-1]=(r.texts[i]||"").trim()||s.t;}); ocr=true; ocrBy=r.by; }
  const text=pages.filter(Boolean).join("\n\n");
  // Text je Seite (für Fundstellen „Seite 3“); leere Seiten bleiben leer, damit die Nummern stimmen
  const pageTexts=pages.map(t=>t||"");
  const note=inkOnly?`„${name}“: Auf ${inkOnly===1?"einer Seite":inkOnly+" Seiten"} steht vermutlich Handschrift neben gedrucktem Text. Ohne Claude wurde dort nur der gedruckte Text gelesen.`:"";
  return {text,ocr,ocrBy,kind:"pdf",note,pages:pageTexts};
}
// Absätze mit ihrer Überschrift (für Fundstellen „Überschrift …, Absatz 2“)
async function docxParas(buf){
  try{ const h=await window.mammoth.convertToHtml({arrayBuffer:buf}); const doc=new DOMParser().parseFromString(h.value,"text/html");
    const out=[]; let head="";
    for(const el of doc.body.querySelectorAll("h1,h2,h3,h4,h5,h6,p,li")){ const t=el.textContent.replace(/\s+/g," ").trim(); if(!t) continue;
      if(/^H\d$/.test(el.tagName)) head=t.slice(0,90); else out.push({h:head,t}); }
    return out; }catch{ return null; }
}
// Eintrag für set.files aus dem Ergebnis von readFile
const fileEntry=(name,r)=>({id:rid("f_"),name,kind:r.kind,text:r.text,ocr:r.ocr,ocrBy:r.ocrBy||"",...(r.pages?{pages:r.pages}:{}),...(r.paras?{paras:r.paras}:{}),addedAt:Date.now()});
async function readFile(file,progress){
  const name=file.name; const ext=(name.split(".").pop()||"").toLowerCase();
  if(ext==="doc") throw new Error(`„${name}“: Alte .doc-Dateien werden nicht unterstützt. Speichere sie als .docx oder PDF.`);
  if(["txt","md"].includes(ext)) return {text:await file.text(),ocr:false,kind:"text"};
  if(ext==="docx"){ progress&&progress(`Lese ${name} …`); await loadScript(MAMMOTH); const buf=await file.arrayBuffer();
    let r; try{ r=await window.mammoth.extractRawText({arrayBuffer:buf}); }
    catch{ throw new Error(`„${name}“ lässt sich nicht öffnen – die Datei ist vermutlich beschädigt, passwortgeschützt oder keine echte DOCX. Speichere sie in Word neu oder als PDF.`); }
    return {text:r.value,ocr:false,kind:"docx",paras:await docxParas(buf)}; }
  if(ext==="pdf") return readPdf(await file.arrayBuffer(),name,progress);
  if(ext==="goodnotes") return readGoodnotes(file,progress,readPdf,ocrImages);
  if(["png","jpg","jpeg","webp","gif","heic"].includes(ext)||file.type.startsWith("image/")){ const r=await ocrImages([file],progress); return {text:r.texts[0]||"",ocr:true,ocrBy:r.by,kind:"bild"}; }
  throw new Error(`„${name}“: Dieses Format wird nicht unterstützt (PDF, DOCX, TXT, GoodNotes oder Bild).`);
}
