/* ---------- Fragen erzeugen ---------- */
function buildPrompt(set,mix,restrict,avoid){
  const total=Object.values(mix).reduce((a,b)=>a+b,0);
  let secs=set.sections; if(restrict&&restrict.length) secs=secs.filter(s=>restrict.includes(s.id));
  const cov=set.coverage||{};
  const ranked=[...secs].sort((a,b)=>(cov[a.id]||0)-(cov[b.id]||0));
  let budget=110000, chosen=new Set();
  for(const s of ranked){ if(budget-s.text.length<0) break; budget-=s.text.length; chosen.add(s.id); }
  const listed=secs.filter(s=>chosen.has(s.id));
  const uncovered=listed.filter(s=>!(cov[s.id]>0)).map(s=>s.id);
  const material=materialText(listed);
  return {material, prompt:`Du erstellst Prüfungsfragen für eine Lernseite. Grundlage ist AUSSCHLIESSLICH das MATERIAL.

REGELN
1. Jede Frage muss sich vollständig aus dem Material beantworten lassen. Keine Inhalte, Zahlen oder Fachbegriffe, die nicht im Material stehen – auch nicht in falschen Antwortmöglichkeiten.
2. Jede Frage hat ein Feld "quote": ein wörtliches, zusammenhängendes Zitat aus dem Material (ein bis zwei Sätze, 40 bis 300 Zeichen), das die Lösung belegt. Exakt so geschrieben wie im Material, ohne Auslassungen, ohne "…".
3. Jede Frage hat "afb" ("I" Wiedergeben, "II" Zusammenhänge herstellen, "III" Anwenden und Beurteilen) wie im Abitur. Verteilung etwa 40 % I, 40 % II, 20 % III.
4. Mindestens ${Math.max(1,Math.round(total/4))} Fragen verknüpfen zwei oder mehr verschiedene Abschnitte. "sections" nennt alle verwendeten Abschnitts-IDs.
5. Genau diese Anzahl je Format: ${mix.mc||0}× "mc", ${mix.text||0}× "text", ${mix.match||0}× "match", ${mix.cloze||0}× "cloze".
${uncovered.length?`6. Diese Abschnitte wurden noch nie abgefragt und haben Vorrang: ${uncovered.slice(0,40).join(", ")}.`:""}
${avoid&&avoid.length?`7. Diese Fragen gab es schon, stelle andere:\n- ${avoid.slice(0,40).join("\n- ")}`:""}
8. Prüfe jede Lösung vor der Ausgabe Wort für Wort gegen das Material. Bei Zuordnungen und Einteilungen in Kategorien (zum Beispiel „glatter Preis“ / „gebrochener Preis“) muss jede einzelne Zuordnung im Material so stehen oder sich zwingend daraus ergeben. Vertausche nie Kategorien; im Zweifel lass die Frage weg.

FORMATE (Felder)
- mc: {"type":"mc","afb","prompt","options":[4 Antworten],"answer":Index der richtigen (0-3),"explain":"1 Satz","quote","sections"}
- text: {"type":"text","afb","prompt","model_answer":"Musterlösung, 1-3 Sätze","key_points":["Kernpunkt",...],"quote","sections"}
- match: {"type":"match","afb","prompt","pairs":[{"left","right"}, 3 bis 5 Paare],"quote","sections"}
- cloze: {"type":"cloze","afb","prompt":"Satz/Sätze mit ___ für jede Lücke (1-3 Lücken)","blanks":[["Lösung","erlaubte Variante"],...] in Reihenfolge der Lücken,"quote","sections"}

Antworte nur mit JSON: {"questions":[...]}`};
}
function validateQ(set,q){
  if(!q||!TYPE_LABEL[q.type]||!q.prompt||!q.quote) return null;
  const loc=locateQuote(set,q.quote); if(!loc) return null;
  const afb=["I","II","III"].includes(q.afb)?q.afb:"II";
  const base={id:rid("q"),type:q.type,afb,prompt:String(q.prompt),quote:String(q.quote),fileName:loc.fileName,sections:[...new Set([...(loc.sectionIds||[]),...((q.sections||[]).filter(id=>set.sections.some(s=>s.id===id)))])]};
  if(q.type==="mc"){ const o=(q.options||[]).map(String).filter(Boolean); const a=Number(q.answer); if(o.length<3||!(a>=0&&a<o.length)) return null; return {...base,options:o,answer:a,explain:q.explain||""}; }
  if(q.type==="text"){ if(!q.model_answer) return null; return {...base,model_answer:String(q.model_answer),key_points:(q.key_points||[]).map(String)}; }
  if(q.type==="match"){ const p=(q.pairs||[]).filter(x=>x&&x.left&&x.right).map(x=>({left:String(x.left),right:String(x.right)})); if(p.length<2||new Set(p.map(x=>x.right)).size!==p.length) return null; return {...base,pairs:p}; }
  if(q.type==="cloze"){ const n=(String(q.prompt).match(/___/g)||[]).length; const b=(q.blanks||[]).map(x=>Array.isArray(x)?x.map(String):[String(x)]); if(!n||b.length!==n) return null; return {...base,blanks:b}; }
  return null;
}
/* ---------- Zweite Prüfung: stimmt die Lösung mit dem Material überein? ---------- */
function solutionText(q){
  if(q.type==="mc") return "Richtige Antwort: "+q.options[q.answer]+" | Falsche Antworten: "+q.options.filter((_,i)=>i!==q.answer).join(" / ");
  if(q.type==="text") return "Musterlösung: "+q.model_answer;
  if(q.type==="match") return "Zuordnung: "+q.pairs.map(p=>p.left+" → "+p.right).join("; ");
  if(q.type==="cloze") return "Lücken: "+q.blanks.map(b=>b[0]).join("; ");
  return "";
}
// material: derselbe Block wie beim Erstellen, damit die Claude API ihn aus dem Zwischenspeicher nimmt
async function verifyQuestions(set,qs,signal,material){
  if(!qs.length||!CAP.sample) return qs;
  if(!material){ const ids=[...new Set(qs.flatMap(q=>q.sections))]; let budget=60000;
    material=materialText(set.sections.filter(s=>ids.includes(s.id)).filter(s=>(budget-=s.text.length)>=0)); }
  const list=qs.map((q,i)=>`#${i} (${q.type}) ${q.prompt}\n${solutionText(q)}\nBeleg: "${q.quote}"`).join("\n\n");
  try{
    const r=await askWithMaterial(`Du kontrollierst Prüfungsfragen einer Lernseite, bevor Lernende sie sehen. Prüfe für jede Frage streng anhand des MATERIALS:
- Ist die angegebene Lösung laut Material richtig und vollständig?
- Bei Multiple Choice: Ist genau eine Antwort richtig, und sind die falschen Antworten laut Material wirklich falsch?
- Bei Zuordnungen und Kategorien: Stimmt jede einzelne Zuordnung, nichts vertauscht?
Im Zweifel "ok": false.

Antworte nur mit JSON: {"checks":[{"i":Nummer,"ok":true|false,"grund":"kurz"}]}

FRAGEN
${list}`,material,{modelTier:"default",cache:false,signal});
    const bad=new Set(((r&&r.checks)||[]).filter(c=>c&&c.ok===false).map(c=>Number(c.i)));
    return qs.filter((_,i)=>!bad.has(i));
  }catch(e){ if(e&&e.code==="cancelled") throw e; return qs; }
}
async function generateQuestions(set,{n=15,restrict=null,onStatus,signal}={}){
  const want=mixFor(n); const got={mc:[],text:[],match:[],cloze:[]}; let dropped=0;
  const avoid=(set.history||[]).flatMap(h=>h.prompts||[]).slice(-60);
  for(let attempt=0;attempt<2;attempt++){
    const need={}; let any=false; for(const k in want){ need[k]=Math.max(0,want[k]-got[k].length); if(need[k]) any=true; }
    if(!any) break;
    onStatus&&onStatus(attempt?"Ersetze verworfene Fragen …":"Claude erstellt die Fragen. Das dauert meist 20–60 Sekunden …");
    const {prompt,material}=buildPrompt(set,need,restrict,[...avoid,...Object.values(got).flat().map(q=>q.prompt)]);
    const res=await askWithMaterial(prompt,material,{modelTier:"default",cache:false,signal});
    const list=Array.isArray(res)?res:(res&&res.questions)||[];
    const valid=[]; for(const raw of list){ const q=validateQ(set,raw); if(!q){dropped++;continue;} valid.push(q); }
    onStatus&&onStatus("Claude prüft die Lösungen gegen dein Material …");
    const checked=await verifyQuestions(set,valid,signal,material); dropped+=valid.length-checked.length;
    for(const q of checked){ if(got[q.type].length<want[q.type]) got[q.type].push(q); }
  }
  const qs=[...got.mc,...got.text,...got.match,...got.cloze];
  return {qs:shuffle(qs),dropped};
}
function exampleQuestions(set){ return shuffle(EXAMPLE_QUESTIONS.map(q=>{ const v=validateQ(set,q); return v; }).filter(Boolean)); }

/* ---------- Durchgang ---------- */
function prepQuestion(q){
  const d={...q};
  if(q.type==="mc"){ const idx=shuffle(q.options.map((_,i)=>i)); d.view={order:idx}; }
  if(q.type==="match"){ d.view={rights:shuffle(q.pairs.map(p=>p.right))}; }
  return d;
}
async function startRound(set,{n=15,restrict=null,label=null,reuse=false,planRef=null,fresh=false}={}){
  let qs, short=null; // short: Das Material gab weniger belegbare (neue) Fragen her als gewünscht
  if(reuse && set.round){ qs=shuffle(set.round.qs.filter(q=>!q.disputed).map(q=>prepQuestion(q))); if(!qs.length){ toast("Keine Fragen übrig – starte einen neuen Durchgang"); return; } }
  else if(set.example && !restrict && !fresh){ qs=exampleQuestions(set).map(prepQuestion); qs.forEach(q=>q.sections.forEach(id=>{ set.coverage[id]=(set.coverage[id]||0)+1; })); }
  else{
    if(!CAP.sample){ toast("Dafür braucht Merkwerk Claude (in claude.ai öffnen)"); return; }
    const box=$("#roundStatus"); const ctl=new AbortController();
    if(box){ box.hidden=false; box.innerHTML=`<div class="row"><span class="spin"></span><span id="rsTxt">Starte …</span><span class="spacer"></span><button class="btn sm" id="rsStop">Abbrechen</button></div>`; $("#rsStop").onclick=()=>ctl.abort(); }
    try{
      const r=await generateQuestions(set,{n,restrict,signal:ctl.signal,onStatus:t=>{const e=$("#rsTxt"); if(e) e.textContent=t;}});
      if(!r.qs.length){ if(box) box.innerHTML=`<div class="note bad">Es konnte keine belegte Frage erzeugt werden. Prüfe unter „Gelesenen Text ansehen“, ob der Text richtig gelesen wurde.</div>`; return; }
      qs=r.qs.map(prepQuestion);
      if(r.qs.length<n) short={got:r.qs.length,want:n,fresh:!!(set.history&&set.history.length)};
      else if(r.dropped) toast(`${r.dropped} Fragen ohne gültigen Beleg oder mit falscher Lösung verworfen und ersetzt`,3500);
    }catch(e){ if(box){ if(e&&e.code==="cancelled"){box.hidden=true;} else box.innerHTML=`<div class="note bad">${esc(sampleErr(e))}</div>`; } return; }
    qs.forEach(q=>q.sections.forEach(id=>{ set.coverage[id]=(set.coverage[id]||0)+1; }));
  }
  set.round={qs,idx:0,results:[],phase:"q",label,restrict,planRef,short,startedAt:Date.now()};
  await putSet(set); S.activeSet=set.id; save(); go("learn",{setId:set.id});
}

/* ---------- Bewertung ---------- */
const cmp=s=>norm(s).replace(/ß/g,"ss").replace(/[^a-z0-9äöü]+/g," ").trim();
// Lückentext: kleine Tipp- und Grammatikfehler (Endungen, Umlaute, ein bis zwei Buchstaben) zählen nicht
function editDist(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const looseWord=w=>w.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/(?:en|em|er|es|e|n|s)$/,"");
const loose=s=>cmp(s).split(" ").filter(Boolean).map(looseWord).join(" ");
// Ergebnis: "exact", "near" (kleine Abweichung) oder false
function clozeMatch(given,answers){
  const g=cmp(given); if(!g) return false;
  if(answers.some(a=>cmp(a)===g)) return "exact";
  return answers.some(a=>{ const b=cmp(a); if(!b) return false;
    const lg=loose(given), lb=loose(a); if(lg===lb) return true;
    const tol=lb.length<=4?0:lb.length<=8?1:2; return editDist(lg,lb)<=tol; })?"near":false;
}
// Kleine Abweichungen zählen nur, wenn sie den Sinn nicht verändern (mit Claude geprüft, ohne Claude großzügig)
async function judgeNearBlanks(q,given,verdicts){
  const near=verdicts.map((v,i)=>v==="near"?i:-1).filter(i=>i>=0);
  if(!near.length||!CAP.sample) return verdicts.map(Boolean);
  try{
    const r=await CAP.sample.json(`Ein Lernender hat einen Lückentext ausgefüllt. Kleine Tipp- oder Grammatikfehler sollen nicht zählen, Abweichungen, die den Sinn verändern, schon (zum Beispiel ein anderes Wort, eine andere Zahl, das Gegenteil, ein anderer Fachbegriff).

Satz: ${q.prompt}
${near.map(i=>`Lücke ${i}: richtig wäre "${q.blanks[i][0]}", geschrieben wurde "${given[i]}"`).join("\n")}

Antworte nur mit JSON: {"luecken":[{"i":Nummer der Lücke,"sinnentstellend":true|false}]}`,{modelTier:"quick",cache:false});
    const bad=new Set(((r&&r.luecken)||[]).filter(x=>x&&x.sinnentstellend===true).map(x=>Number(x.i)));
    return verdicts.map((v,i)=>v==="exact"||(v==="near"&&!bad.has(i)));
  }catch{ return verdicts.map(Boolean); }
}
async function gradeText(q,answer){
  if(!CAP.sample) return null;
  const r=await CAP.sample.json(`Bewerte die Antwort eines Lernenden auf eine Prüfungsfrage. Bewerte nur inhaltlich anhand der Musterlösung und des Belegs. Rechtschreib-, Tipp- und Grammatikfehler zählen nicht, außer sie verändern den Sinn (zum Beispiel ein anderes Fachwort, eine andere Zahl oder das Gegenteil).

Frage: ${q.prompt}
Musterlösung: ${q.model_answer}
Kernpunkte: ${(q.key_points||[]).join("; ")}
Beleg aus dem Material: "${q.quote}"

Antwort des Lernenden: """${answer.slice(0,3000)}"""

Antworte nur mit JSON: {"verdict":"richtig"|"teilweise"|"falsch","score":Zahl 0 bis 1,"feedback":"2 bis 3 Sätze auf Deutsch, direkt an den Lernenden, was stimmt und was fehlt"}`,{modelTier:"default",cache:false});
  const score=clamp(Number(r.score)||0,0,1);
  return {correct: r.verdict==="richtig" || score>=0.6, verdict:r.verdict||"", score, feedback:String(r.feedback||"")};
}

async function addFiles(set,files){
  const st=$("#upStatus"); const errs=[]; const notes=[];
  for(const f of files){
    try{ const r=await readFile(f,t=>{st.innerHTML=`<span class="spin"></span> ${esc(t)}`;});
      if(!r.text.trim()){ errs.push(r.kind==="bild"?`„${f.name}“: Die Texterkennung hat keinen Text gefunden. Fotografiere die Seite gerade, scharf und mit mehr Licht oder lade eine PDF hoch.`:`„${f.name}“: Kein Text gefunden. Ist es ein Scan? Dann lade die Seiten als Fotos oder als PDF mit Text hoch.`); continue; }
      set.files.push(fileEntry(f.name,r));
      if(r.note) notes.push(r.note);
      if(r.ocrBy==="browser"&&!notes.includes(BROWSER_OCR_NOTE)) notes.push(BROWSER_OCR_NOTE);
    }catch(e){ errs.push(e&&e.code?`„${f.name}“: ${sampleErr(e)}`:String(e.message||e)); }
  }
  set.sections=makeSections(set.files); set.cards=null; set.fc=null; await putSet(set);
  go("learn",{manage:true});
  if(errs.length||notes.length) setTimeout(()=>{const s=$("#upStatus"); if(s) s.innerHTML=(errs.length?`<div class="note bad">${errs.map(esc).join("<br>")}</div>`:"")+(notes.length?`<div class="note warn">${notes.map(esc).join("<br>")}</div>`:"");},50);
  if(!errs.length) toast(`${files.length} Datei(en) gelesen`);
}

}

      <div class="row"><button class="btn primary" id="nextQ">${R.idx+1<R.qs.length?"Nächste Frage":"Auswertung ansehen"}</button></div></div>`;
    $("#nextQ").onclick=async()=>{ if(R.idx+1<R.qs.length){R.idx++;} else { R.phase="end"; const pctv=Math.round(R.results.filter(r=>r&&r.correct).length/R.qs.length*100); (set.history ||= []).push({at:Date.now(),pct:pctv,prompts:R.qs.map(q=>q.prompt)}); if(R.planRef) markPlanDone(R.planRef,pctv); } await putSet(set); renderRound(m,set); };
    const dp=$("#dispute"); if(dp) dp.onclick=async()=>{ q.disputed=true; const orig=R.qs.find(x=>x.id===q.id); if(orig) orig.disputed=true; R.results[R.idx]={...res,correct:true,disputed:true}; await putSet(set); renderRound(m,set); };
    mountWhy($("#whyBox"),set,q,res);

}

/* ===================== Karteikarten ===================== */
// set.cards: [{id,term,definition,quote,fileName}]
// set.fc:    {ids:[Karten-IDs in Reihenfolge], idx, known:[ids], practice:[ids], phase:"card"|"end", retry}

function cardCountFor(set){ const chars=set.files.reduce((a,f)=>a+f.text.length,0); return clamp(Math.round(chars/350),8,40); }

/* ---------- Karten mit Claude ---------- */
function buildCardPrompt(set,n){
  let budget=110000; const listed=[];
  for(const s of set.sections){ if(budget-s.text.length<0) break; budget-=s.text.length; listed.push(s); }
  const material=materialText(listed);
  return {material, prompt:`Du erstellst Karteikarten für eine Lernseite. Grundlage ist AUSSCHLIESSLICH das MATERIAL.

REGELN
1. Jede Karte hat "term": einen Fachbegriff, Namen oder eine kurze Bezeichnung aus dem Material (höchstens 6 Wörter), und "definition": eine Erklärung in 1 bis 2 Sätzen, nur mit Inhalten aus dem Material. Der Begriff selbst steht nicht in der Definition.
2. Jede Karte hat "quote": ein wörtliches, zusammenhängendes Zitat aus dem Material (40 bis 300 Zeichen), das die Definition belegt. Exakt so geschrieben wie im Material, ohne Auslassungen, ohne "…".
3. Etwa ${n} Karten, verteilt über das ganze Material. Jeder Begriff nur einmal, die wichtigsten zuerst.
4. Prüfe jede Definition vor der Ausgabe Wort für Wort gegen das Material. Vertausche nie Begriffe oder Kategorien (zum Beispiel „glatter Preis“ und „gebrochener Preis“); im Zweifel lass die Karte weg.

Antworte nur mit JSON: {"cards":[{"term","definition","quote"}]}`};
}
function validateCard(set,c){
  if(!c||!c.term||!c.definition||!c.quote) return null;
  const term=String(c.term).trim(), def=String(c.definition).trim();
  if(term.length>90||def.length<4||def.length>600) return null;
  const loc=locateQuote(set,c.quote); if(!loc) return null;
  return {id:rid("c"),term,definition:def,quote:String(c.quote),fileName:loc.fileName};
}
function dedupeCards(cards){ const seen=new Set(); return cards.filter(c=>{ const k=relax(c.term); if(!k||seen.has(k)) return false; seen.add(k); return true; }); }
async function generateCards(set,{signal}={}){
  const n=cardCountFor(set);
  const {prompt,material}=buildCardPrompt(set,n);
  const res=await askWithMaterial(prompt,material,{modelTier:"default",cache:false,signal});
  const list=Array.isArray(res)?res:(res&&res.cards)||[];
  const cards=dedupeCards(list.map(c=>validateCard(set,c)).filter(Boolean));
  return {cards,dropped:list.length-cards.length};
}

/* ---------- Karten ohne Claude: Definitionssätze im Text erkennen ---------- */
const CARD_STOP=new Set(["es","er","sie","das","dies","diese","dieser","dieses","man","hier","dort","dabei","daher","deshalb","so","wir","ihr","ich","du","beide","alle","viele","manche","einige","er","jeder","jede","jedes"]);
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const stripArticle=s=>s.replace(/^(der|die|das|den|dem|des|ein|eine|einen|einem|eines)\s+/i,"").trim();
function extractCardsLocal(set){
  const out=[];
  for(const f of set.files){
    const sents=String(f.text||"").replace(/\r/g,"").split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
    sents.forEach((s,i)=>{
      if(s.length<20||s.length>420) return;
      let term=null, def=null;
      let m=s.match(/^(.{8,}?)[;,:]?\s+(?:diese[nrs]?\s+\S+\s+)?(?:nennt|bezeichnet)\s+man\s+(?:als\s+)?(.{2,60}?)[.!]?$/i);
      if(m){ term=m[2]; def=m[1]; }
      if(!term){ m=s.match(/^(?:Dieser|Diese|Dieses)\s+\S+\s+(?:wird|werden)\s+(?:auch\s+)?als\s+(.{2,60}?)\s+bezeichnet[.!]?$/);
        if(m&&i>0){ term=m[1]; def=sents[i-1]; } }
      if(!term){ m=s.match(/^(?:Unter\s+(?:dem|der|den)\s+)?((?:(?:Der|Die|Das|Ein|Eine)\s+)?[A-ZÄÖÜ][\wÄÖÜäöüß-]*(?:\s+[\wÄÖÜäöüß-]+){0,2}?)\s+(?:ist|sind|bezeichnet|beschreibt|bedeutet|versteht\s+man)\s+(.{20,})$/);
        if(m){ term=m[1]; def=m[2]; } }
      if(!term) return;
      term=capFirst(stripArticle(term.replace(/[„“"]/g,""))); def=capFirst(def.trim().replace(/[;,:]$/,""));
      if(!/[.!?]$/.test(def)) def+=".";
      if(term.length<2||CARD_STOP.has(term.toLowerCase())||!/^[A-ZÄÖÜ0-9]/.test(term)) return;
      out.push({id:rid("c"),term,definition:def,quote:s,fileName:f.name});
    });
  }
  return dedupeCards(out).slice(0,40);
}
function exampleCards(set){ return EXAMPLE_CARDS.map(c=>validateCard(set,c)).filter(Boolean); }

/* ---------- Durchlauf ---------- */
function fcStart(set,ids,retry=false){ set.fc={ids:shuffle(ids),idx:0,known:[],practice:[],phase:"card",retry}; return set.fc; }
function fcAssign(set,cat){
  const F=set.fc; if(!F||F.phase!=="card") return F;
  const id=F.ids[F.idx]; (cat==="known"?F.known:F.practice).push(id);
  F.idx++; if(F.idx>=F.ids.length) F.phase="end";
  return F;
}
function fcResult(F){ const n=F.known.length+F.practice.length; return {n,known:F.known.length,practice:F.practice.length,pct:n?Math.round(F.known.length/n*100):0}; }

async function openCards(set,{rebuild=false}={}){
  if(!set.files.length){ toast("Lade zuerst Material hoch"); return; }
  if(!set.cards||!set.cards.length||rebuild){
    let cards=[];
    if(set.example) cards=exampleCards(set);
    else if(CAP.sample){
      const box=$("#roundStatus"); const ctl=new AbortController();
      if(box){ box.hidden=false; box.innerHTML=`<div class="row"><span class="spin"></span><span>Claude erstellt Karteikarten aus deinem Material …</span><span class="spacer"></span><button class="btn sm" id="rsStop">Abbrechen</button></div>`; $("#rsStop").onclick=()=>ctl.abort(); }
      try{ const r=await generateCards(set,{signal:ctl.signal}); cards=r.cards; if(r.dropped) toast(`${r.dropped} Karten ohne gültigen Beleg verworfen`,3500); }
      catch(e){ if(box){ if(e&&e.code==="cancelled") box.hidden=true; else box.innerHTML=`<div class="note bad">${esc(sampleErr(e))}</div>`; } return; }
    } else cards=extractCardsLocal(set);
    if(!cards.length){ const box=$("#roundStatus"); if(box){ box.hidden=false; box.innerHTML=`<div class="note bad">${CAP.sample?"Es konnte keine belegte Karte erstellt werden. Prüfe unter „Gelesenen Text ansehen“, ob der Text richtig gelesen wurde.":"Im Material wurden keine Begriffe mit Definition erkannt. Öffne Merkwerk in claude.ai, dann erstellt Claude die Karteikarten."}</div>`; } return; }
    set.cards=cards; set.fc=null;
  }
  if(!set.fc||rebuild) fcStart(set,set.cards.map(c=>c.id));
  await putSet(set); S.activeSet=set.id; save(); go("learn",{setId:set.id,cards:true});
}

let fcKeyHandler=null;
function setFcKeys(fn){ if(fcKeyHandler) document.removeEventListener("keydown",fcKeyHandler); fcKeyHandler=fn; if(fn){ document.addEventListener("keydown",fn); cleanup.push(()=>setFcKeys(null)); } }
const reduceMotion=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderCards(m,set){
  const F=set.fc; if(!F||!set.cards) return go("learn",{manage:true});
  if(F.phase==="end") return renderCardsEnd(m,set);
  const byId=Object.fromEntries(set.cards.map(c=>[c.id,c]));
  const card=byId[F.ids[F.idx]]; if(!card){ F.ids=F.ids.filter(id=>byId[id]); F.idx=Math.min(F.idx,F.ids.length); if(F.idx>=F.ids.length) F.phase="end"; putSet(set); return renderCards(m,set); }
  const total=F.ids.length, done=F.idx, pct=Math.round(done/total*100);
  m.innerHTML=`<div class="view">
   ${modeBarHTML(set,"cards")}
   ${F.retry?'<div class="row"><span class="pill warn">Nicht gewusste</span></div>':""}
   <div class="fc-progress" aria-label="Fortschritt"><span class="mono"><b>${done}</b> / ${total}</span><div class="fc-bar"><i style="width:${pct}%"></i></div></div>
   <div class="fc-stage">
     <button class="fc-zone know" id="zKnow" type="button" aria-label="Weiß ich (${F.known.length})"><span class="fc-count mono">${F.known.length}</span><span class="fc-zl">weiß ich</span><span class="fc-arrow" aria-hidden="true">←</span></button>
     <div class="fc-card" id="fcCard" tabindex="0" role="button" aria-label="Karte umdrehen">
       <div class="fc-inner">
         <div class="fc-face fc-front"><span class="label">Begriff</span><p class="fc-term">${esc(card.term)}</p><span class="small muted">Antippen zum Umdrehen</span></div>
         <div class="fc-face fc-back" aria-hidden="true"><span class="label">Definition</span><p class="fc-def">${esc(card.definition)}</p><p class="quote small">„${esc(card.quote)}“ <span class="muted">– ${esc(card.fileName)}</span></p></div>
       </div>
     </div>
     <button class="fc-zone practice" id="zPractice" type="button" aria-label="Muss ich noch üben (${F.practice.length})"><span class="fc-count mono">${F.practice.length}</span><span class="fc-zl">muss ich noch üben</span><span class="fc-arrow" aria-hidden="true">→</span></button>
   </div>
   <p class="small muted" style="text-align:center">Karte antippen zum Umdrehen · nach links oder rechts ziehen zum Einordnen · Tastatur: Leertaste, ← und →</p>
  </div>`;
  bindModeBar(set,"cards");
  const el=$("#fcCard"), inner=$(".fc-inner",el), zK=$("#zKnow"), zP=$("#zPractice");
  let flipped=false, busy=false;
  const flip=()=>{ flipped=!flipped; inner.classList.toggle("flipped",flipped); $(".fc-front",el).setAttribute("aria-hidden",String(flipped)); $(".fc-back",el).setAttribute("aria-hidden",String(!flipped)); };
  const assign=async cat=>{
    if(busy) return; busy=true;
    (cat==="known"?zK:zP).classList.add("hot");
    const fly=()=>new Promise(r=>{ if(reduceMotion()) return r(); el.style.transition="transform .28s ease-in, opacity .28s ease-in"; el.style.transform=`translateX(${cat==="known"?"-":""}110vw) rotate(${cat==="known"?-14:14}deg)`; el.style.opacity="0"; setTimeout(r,260); });
    await fly(); fcAssign(set,cat); await putSet(set); renderCards(m,set);
  };
  el.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} };
  const onKey=e=>{ if(e.target.closest&&e.target.closest("input,textarea,select")) return; if(e.key==="ArrowLeft"){e.preventDefault();assign("known");} else if(e.key==="ArrowRight"){e.preventDefault();assign("practice");} };
  setFcKeys(onKey);
  zK.onclick=()=>assign("known"); zP.onclick=()=>assign("practice");
  // Ziehen mit Maus, Finger oder Stift; ein kurzer Klick dreht die Karte um
  let sx=0, sy=0, dx=0, pid=null, moved=false;
  const thresh=()=>Math.min(140,Math.max(60,el.offsetWidth*0.28));
  const hot=()=>{ const t=thresh(); zK.classList.toggle("hot",dx<-t); zP.classList.toggle("hot",dx>t); };
  const reset=()=>{ el.style.transition="transform .2s ease"; el.style.transform=""; dx=0; hot(); el.classList.remove("dragging"); };
  el.onpointerdown=e=>{ if(busy||e.button>0) return; pid=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; moved=false; el.style.transition="none"; };
  el.onpointermove=e=>{ if(e.pointerId!==pid) return; dx=e.clientX-sx; if(!moved&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-sy)){ moved=true; el.classList.add("dragging"); try{el.setPointerCapture(pid);}catch{} } if(moved){ el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; hot(); } };
  el.onpointerup=e=>{ if(e.pointerId!==pid) return; pid=null;
    if(!moved){ flip(); return; }
    const t=thresh(); if(dx<-t) assign("known"); else if(dx>t) assign("practice"); else reset(); };
  el.onpointercancel=()=>{ pid=null; if(moved) reset(); };
  el.focus({preventScroll:true});
}

// Typische Themen aus der Themenliste (Orientierung am Bildungsplan)
function curatedTopics(subject,p=S.profile){
  const alias=topicAlias(subject||""); const band=topicBand(p);
  return p&&p.track==="schule"&&alias&&TOPICS[alias]?(TOPICS[alias][band]||[]):[];
}
function levelText(p=S.profile){
  if(!p) return "";
  return p.track==="uni"?`Studium ${p.program||""}${p.semester?`, ${p.semester}. Semester`:""}${p.uni?` an der ${p.uni}`:""}`:profileLabel(p);
}
// Claude schlägt Themen aus dem Bildungsplan vor
async function claudeTopics(subject,docs){
  const p=S.profile;
  const ctx=p&&p.track==="schule"
    ?`im Fach "${subject}" für ${profileLabel(p)} laut dem geltenden Bildungsplan${docs.length?` (${docs.slice(0,3).map(d=>d.title).join("; ")})`:""}`
    :`im Fach bzw. Modul "${subject}"${p?` (${levelText(p)})`:""}`;
  const r=await CAP.sample.json(`Nenne die Themen ${ctx}. Antworte nur mit JSON: {"topics":["Thema",...],"sicher":true|false} mit 8 bis 16 kurzen Themenbezeichnungen in der Reihenfolge des Plans. "sicher" ist false, wenn du den konkreten Plan nicht genau kennst.`,{modelTier:"default",cache:{gcTime:864e5}});
  return {topics:(r.topics||[]).map(String).slice(0,20),sure:!!r.sicher};
}

/* ---------- Lerninhalte generieren ---------- */
const WIKI="https://de.wikipedia.org/w/api.php";
async function wikiSearch(q,n=3,signal){
  const r=await fetch(`${WIKI}?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=${n}&format=json&origin=*`,{signal});
  const j=await r.json(); return ((j.query&&j.query.search)||[]).map(x=>x.title);
}
async function wikiText(title,signal){
  const r=await fetch(`${WIKI}?action=query&prop=extracts&explaintext=1&exsectionformat=plain&redirects=1&titles=${encodeURIComponent(title)}&format=json&origin=*`,{signal});
  const j=await r.json(); const pg=Object.values((j.query&&j.query.pages)||{})[0]||{};
  // Literatur, Weblinks und Einzelnachweise abschneiden
  const t=String(pg.extract||"").split(/\n(?:Literatur|Weblinks|Einzelnachweise|Siehe auch|Anmerkungen)\n/)[0].replace(/\n{3,}/g,"\n\n").trim();
  return {title:pg.title||title,text:t,url:`https://de.wikipedia.org/wiki/${encodeURIComponent((pg.title||title).replace(/ /g,"_"))}`};
}
// Suchlinks zu Erklärungen und Videos (YouTube ohne eigenen Schlüssel nur als Suche)
function learnLinks(subject,topic,p=S.profile){
  const lvl=p&&p.track==="schule"&&p.grade?` Klasse ${p.grade}`:"";
  const q=`${topic} ${subject}`.trim();
  return [
    {kind:"Video",title:`YouTube: Erklärvideos zu „${topic}“`,url:`https://www.youtube.com/results?search_query=${encodeURIComponent(q+" einfach erklärt"+lvl)}`},
    {kind:"Erklärung",title:`Serlo: „${topic}“`,url:`https://de.serlo.org/search?q=${encodeURIComponent(topic)}`},
    {kind:"Erklärung",title:`Wikipedia-Suche: „${topic}“`,url:`https://de.wikipedia.org/w/index.php?search=${encodeURIComponent(topic)}`},
  ];
}
// Prüft Fach und Thema gegen den Bildungsplan. Ohne Claude: Abgleich mit der Themenliste.

  const p=S.profile; const cur=curatedTopics(set.subject,p);
  const inList=cur.some(t=>subjKey(t)===subjKey(set.topic)||subjKey(t).includes(subjKey(set.topic))||subjKey(set.topic).includes(subjKey(t)));

  const r=await CAP.sample.json(`Du prüfst für eine Lernseite, ob ein Thema zum Bildungsplan eines Lernenden passt.

Lernende/r: ${levelText(p)||"keine Angaben"}
Fach: ${set.subject||"(nicht angegeben)"}
Thema: ${set.topic}

${cur.length?`Typische Themen dieser Stufe: ${cur.join("; ")}`:""}

Antworte nur mit JSON: {"passt":"ja"|"teilweise"|"nein","hinweis":"1 bis 2 Sätze an den Lernenden: in welcher Klassenstufe und welchem Rahmen das Thema laut Plan dran ist","schwerpunkte":["was laut Plan auf dieser Stufe gekonnt werden soll", 3 bis 6 Punkte],"suchbegriffe":["1 bis 2 Begriffe für die Suche in Wikipedia"]}. Wenn du den konkreten Plan nicht sicher kennst, sag das im Hinweis.`,{modelTier:"default",cache:{gcTime:864e5},signal});
  return {fit:["ja","teilweise","nein"].includes(r.passt)?r.passt:"offen",note:String(r.hinweis||""),focus:(r.schwerpunkte||[]).map(String).slice(0,8),terms:(r.suchbegriffe||[]).map(String).filter(Boolean).slice(0,2)};

async function generateContent(set,{onStatus,signal}={}){
  const p=S.profile;

  const docs=p&&p.track==="schule"&&await loadPlans()?plansForSubject(p,set.subject).docs:[];

  }catch(e){ if(e&&e.name==="AbortError") throw e; wiki=[]; }
  const links=[...wiki.map(w=>({kind:"Quelle",title:`Wikipedia: ${w.title}`,url:w.url})),...learnLinks(set.subject,set.topic,p)];
  const files=[];
  if(CAP.sample){
    onStatus&&onStatus(wiki.length?"Claude schreibt aus den Quellen deinen Lerntext …":"Claude schreibt deinen Lerntext …");
    const src=wiki.map(w=>`[Wikipedia: ${w.title}]\n${w.text.slice(0,24000)}`).join("\n\n");
    const {text}=await CAP.sample(`Schreibe einen Lerntext für eine Lernseite.

Lernende/r: ${levelText(p)||"keine Angaben"}

Thema: ${set.topic}
${check.focus.length?`Laut Bildungsplan soll auf dieser Stufe gekonnt werden:\n- ${check.focus.join("\n- ")}`:""}

/* ===================== KI-Tutor: „Warum ist das falsch?“ und Probeklausur ===================== */
// Beides braucht Claude (CAP.sample). Grundlage ist immer das eigene Material, nie Wissen von außerhalb.

const levelOf=()=>S.profile?profileLabel(S.profile):"";
function sectionsText(set,ids,budget=8000){
  return set.sections.filter(s=>ids.includes(s.id)).filter(s=>(budget-=s.text.length)>=0).map(s=>s.text).join("\n\n");
}
// Was der Lernende geantwortet hat, als lesbarer Text
function givenText(q,res){
  if(!res) return "";
  if(q.type==="mc") return q.options[res.given]||"";
  if(q.type==="text") return String(res.given||"");
  if(q.type==="match") return q.pairs.map((p,i)=>`${p.left} → ${(res.given||[])[i]||"–"}`).join("; ");
  if(q.type==="cloze") return (res.given||[]).map((g,i)=>`Lücke ${i+1}: ${g}`).join("; ");
  return "";
}

/* ---------- Warum ist das falsch? ---------- */
function whyPrompt(set,q,res,turns,ask){
  const lvl=levelOf();
  return `Du bist ein geduldiger Nachhilfelehrer auf einer Lernseite${lvl?` (Lernende: ${lvl})`:""}. Ein Lernender hat eine Prüfungsfrage falsch beantwortet.

Frage (${TYPE_LABEL[q.type]}): ${q.type==="cloze"?q.prompt.replace(/___/g,"_____"):q.prompt}
Richtige Lösung: ${solutionText(q)}
Antwort des Lernenden: ${givenText(q,res)||"(keine)"}
${res.feedback?`Bisherige Bewertung: ${res.feedback}\n`:""}Beleg aus dem Material: "${q.quote}"

MATERIAL (Ausschnitt)
${sectionsText(set,q.sections)||q.quote}
${turns.length?`\nBISHERIGES GESPRÄCH\n${turns.map(t=>(t.q?`Lernender: ${t.q}\n`:"")+`Du: ${t.a}`).join("\n\n")}\n`:""}
${ask?`Der Lernende fragt nach: """${ask.slice(0,1000)}"""
Beantworte die Nachfrage in 2 bis 5 Sätzen.`:`Erkläre in 3 bis 5 Sätzen, was an der Antwort nicht stimmt und warum die Lösung richtig ist. Gehe auf den konkreten Denkfehler ein (zum Beispiel verwechselte Begriffe), nicht nur auf das Ergebnis. Schließe mit einer kurzen Merkhilfe ab, die mit „Merke:“ beginnt.`}
Sprich den Lernenden mit „du“ an, schreib einfach und passend zur Stufe. Stütze dich nur auf das Material; wenn es eine Nachfrage nicht beantwortet, sag das ehrlich. Kein Markdown, keine Überschriften.`;
}
async function explainWrong(set,q,res,ask,onText){
  const turns=res.why||[];
  const {text}=await CAP.sample(whyPrompt(set,q,res,turns,ask),{modelTier:"default",cache:false,onText:u=>onText&&onText(u.text)});
  return String(text||"").trim();
}
// Kasten unter der Lösung einer falsch beantworteten Frage
function mountWhy(el,set,q,res){
  if(!el) return;
  if(!CAP.sample){ el.innerHTML=""; return; }
  const turns=res.why||[];
  el.innerHTML=`<div class="why stack" style="gap:8px">
    ${turns.map(t=>`${t.q?`<p class="small muted">Du: ${esc(t.q)}</p>`:""}<p class="why-a">${esc(t.a)}</p>`).join("")}
    <div id="whyLive" hidden><p class="why-a"></p></div>
    <div id="whyErr"></div>
    ${turns.length?`<div class="row" style="flex-wrap:nowrap"><input type="text" id="whyAsk" placeholder="Nachfragen, z. B. „Was ist der Unterschied zu …?“" style="flex:1"><button class="btn sm" id="whyGo">Fragen</button></div>`
      :`<div><button class="btn sm" id="whyGo">Warum ist das falsch?</button></div>`}
  </div>`;
  const go=$("#whyGo",el), inp=$("#whyAsk",el);
  const run=async()=>{
    const ask=inp?inp.value.trim():"";
    if(inp&&!ask){ inp.focus(); return; }
    go.disabled=true; if(inp) inp.disabled=true;
    const live=$("#whyLive",el); live.hidden=false; live.firstElementChild.innerHTML=`<span class="spin"></span> Claude erklärt …`;
    try{
      const a=await explainWrong(set,q,res,ask,t=>{ live.firstElementChild.textContent=t; });
      res.why=[...turns,{q:ask||null,a}]; await putSet(set); mountWhy(el,set,q,res);
    }catch(e){ live.hidden=true; $("#whyErr",el).innerHTML=`<div class="note bad small">${esc(sampleErr(e))}</div>`; go.disabled=false; if(inp) inp.disabled=false; }
  };
  go.onclick=run;
  if(inp) inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); run(); } };
}

/* ---------- Probeklausur ---------- */
const EXAM_DURATIONS=[30,45,60,90,0]; // 0 = ohne Zeitlimit
const examTaskCount=min=>min<=30?4:min<=45?5:min<=60?6:min<=90?7:5;
const examPoints=min=>min?Math.round(min*0.8/5)*5:40; // etwa 0,8 Bewertungseinheiten pro Minute
const examById=id=>(S.exams||[]).find(e=>e.id===id);
const examSubjectOf=set=>(set.subject||"").trim();
function examSets(subject,fallback){
  const withFiles=SETS.filter(s=>s.files&&s.files.length);
  const same=subject?withFiles.filter(s=>examSubjectOf(s)&&(examSubjectOf(s).toLowerCase()===subject.toLowerCase()||sameSubject(examSubjectOf(s),subject))):[];
  if(same.length) return same;
  return fallback?[fallback]:[];
}

// Schätzung nach der Notenpunkte-Skala der Oberstufe (wie im Abitur). Lehrkräfte nutzen teils andere Schlüssel.
const NP_STEPS=[95,90,85,80,75,70,65,60,55,50,45,40,33,27,20]; // ab x % → 15, 14, … 1 Notenpunkte
function notenpunkte(pct){ const i=NP_STEPS.findIndex(p=>pct>=p); return i<0?0:15-i; }
function noteFromNP(np){ if(np===0) return "6"; const n=5-Math.floor((np-1)/3); const t=(np-1)%3; return n+(t===2?"+":t===0?"-":""); }
const UNI_STEPS=[[95,"1,0"],[90,"1,3"],[85,"1,7"],[80,"2,0"],[75,"2,3"],[70,"2,7"],[65,"3,0"],[60,"3,3"],[55,"3,7"],[50,"4,0"]];
function gradeEstimate(pct,profile){
  if(profile&&profile.track==="uni"){ const s=UNI_STEPS.find(([p])=>pct>=p); return {main:s?s[1]:"5,0",sub:pct>=50?"bestanden":"nicht bestanden"}; }
  const np=notenpunkte(pct);
  const upper=profile&&Number(profile.grade)>=11;
  return {main:noteFromNP(np),sub:upper?`${np} Notenpunkte`:"",np};
}

function examPrompt(sets,subject,minutes,total){
  const n=examTaskCount(minutes); const lvl=levelOf();
  let budget=110000;
  const material=sets.map((s,si)=>{
    const parts=[]; for(const sec of s.sections){ if((budget-=sec.text.length)<0) break; parts.push(`[L${si+1}/${sec.id}]\n${sec.text}`); }
    return parts.length?`=== Lernset L${si+1}: ${s.name} ===\n${parts.join("\n\n")}`:"";
  }).filter(Boolean).join("\n\n");
  return `Du erstellst eine Probeklausur${subject?` im Fach ${subject}`:""}${lvl?` für: ${lvl}`:""}. Sie soll sich anfühlen wie eine echte Klassenarbeit bzw. Klausur dieser Schulart und Stufe. Grundlage ist AUSSCHLIESSLICH das Material unten.

REGELN
1. ${n} Aufgaben, zusammen genau ${total} Bewertungseinheiten (BE)${minutes?`, lösbar in ${minutes} Minuten`:""}. Mehr BE für umfangreichere Aufgaben.
2. Aufgaben mit Operatoren wie in echten Klausuren (nenne, beschreibe, erkläre, vergleiche, begründe, beurteile, wende an). Anforderungsbereiche etwa 30 % AFB I, 45 % AFB II, 25 % AFB III. Beginne leicht, steigere dich.
3. Mindestens eine Aufgabe verknüpft Inhalte aus verschiedenen Abschnitten${sets.length>1?" oder Lernsets":""}. Eine Aufgabe darf Teilaufgaben a), b) haben; dann steht alles in "prompt".
4. Jede Aufgabe muss sich vollständig aus dem Material beantworten lassen; keine Fakten von außerhalb.
5. "expectation": der Erwartungshorizont, also was eine volle Antwort enthalten muss, 2 bis 5 Sätze. "key_points": die Punkte, für die es BE gibt.
6. "quote": ein wörtliches, zusammenhängendes Zitat aus dem Material (40 bis 300 Zeichen), das die Lösung belegt, exakt so geschrieben wie im Material. "set": die Nummer des Lernsets (1, 2, …), aus dem das Zitat stammt.

Antworte nur mit JSON: {"title":"kurzer Titel der Klausur","tasks":[{"prompt","points":Zahl,"afb":"I"|"II"|"III","expectation","key_points":["…"],"quote","set":Zahl}]}

MATERIAL
${material}`;
}
function validateExamTask(sets,t){
  if(!t||!t.prompt||!t.expectation||!t.quote) return null;
  const pref=sets[Number(t.set)-1]; const order=pref?[pref,...sets.filter(s=>s!==pref)]:sets;
  let loc=null, from=null; for(const s of order){ loc=locateQuote(s,t.quote); if(loc){ from=s; break; } }
  if(!loc) return null;
  return {id:rid("t"),prompt:String(t.prompt),points:clamp(Math.round(Number(t.points)||0),1,40),afb:["I","II","III"].includes(t.afb)?t.afb:"II",
    expectation:String(t.expectation),key_points:(t.key_points||[]).map(String),quote:String(t.quote),fileName:loc.fileName,setId:from.id};
}
async function generateExam(sets,subject,minutes,signal){
  const total=examPoints(minutes);
  const r=await CAP.sample.json(examPrompt(sets,subject,minutes,total),{modelTier:"default",cache:false,signal});
  const tasks=((r&&r.tasks)||[]).map(t=>validateExamTask(sets,t)).filter(Boolean);
  tasks.forEach((t,i)=>t.nr=i+1);
  return {title:String((r&&r.title)||"").trim(),tasks,dropped:((r&&r.tasks)||[]).length-tasks.length};
}

function examGradePrompt(ex){
  const lvl=levelOf();
  const list=ex.tasks.filter(t=>(ex.answers[t.id]||"").trim()).map(t=>`AUFGABE ${t.nr} (${t.points} BE, AFB ${t.afb})
${t.prompt}
Erwartungshorizont: ${t.expectation}
BE-relevante Punkte: ${t.key_points.join("; ")}
Beleg aus dem Material: "${t.quote}"
Antwort: """${String(ex.answers[t.id]).slice(0,4000)}"""`).join("\n\n");
  return `Du korrigierst eine Probeklausur${ex.subject?` im Fach ${ex.subject}`:""}${lvl?` (${lvl})`:""} wie eine faire Lehrkraft nach dem Erwartungshorizont.
- Vergib für jede Aufgabe Punkte zwischen 0 und der maximalen BE, halbe Punkte sind erlaubt. Teilweise richtige Antworten bekommen Teilpunkte.
- Rechtschreib-, Tipp- und Grammatikfehler kosten keine Punkte, außer sie verändern den Sinn (anderes Fachwort, andere Zahl, Gegenteil).
- Richtige Inhalte, die anders formuliert sind als im Erwartungshorizont, zählen voll.
- "feedback": 2 bis 3 Sätze direkt an den Lernenden (du): was gut war, was für volle Punktzahl fehlt.

Antworte nur mit JSON: {"aufgaben":[{"nr":Nummer,"punkte":Zahl,"feedback":"…"}],"gesamt":"2 bis 3 Sätze: Stärken, Schwächen und was du vor der echten Klausur wiederholen solltest"}

${list}`;
}
async function gradeExam(ex,signal){
  const grading={tasks:{},overall:""};
  ex.tasks.forEach(t=>{ if(!(ex.answers[t.id]||"").trim()) grading.tasks[t.id]={points:0,feedback:"Keine Antwort abgegeben."}; });
  if(ex.tasks.some(t=>(ex.answers[t.id]||"").trim())){
    const r=await CAP.sample.json(examGradePrompt(ex),{modelTier:"default",cache:false,signal});
    for(const a of (r&&r.aufgaben)||[]){ const t=ex.tasks.find(x=>x.nr===Number(a.nr)); if(!t||grading.tasks[t.id]) continue;
      grading.tasks[t.id]={points:clamp(Math.round((Number(a.punkte)||0)*2)/2,0,t.points),feedback:String(a.feedback||"")}; }
    grading.overall=String((r&&r.gesamt)||"");
  }
  ex.tasks.forEach(t=>{ grading.tasks[t.id] ||= {points:0,feedback:"Diese Aufgabe konnte nicht bewertet werden."}; });
  grading.got=ex.tasks.reduce((a,t)=>a+grading.tasks[t.id].points,0);
  grading.max=ex.tasks.reduce((a,t)=>a+t.points,0);
  grading.pct=grading.max?Math.round(grading.got/grading.max*100):0;
  return grading;
}

const fmtClock=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
const examLeft=ex=>ex.minutes?Math.max(0,Math.round((ex.startedAt+ex.minutes*6e4-Date.now())/1000)):null;

VIEWS.exam=async function(m,arg){
  if(!SETS.length) await loadSets();
  const ex=examById(arg&&arg.id)||(S.exams||[])[0];
  if(!ex){ go("learn",{manage:true}); return; }
  ROUTE.arg={id:ex.id};
  if(ex.phase==="write") return renderExamWrite(m,ex);
  return renderExamResult(m,ex);
};
function backFromExam(ex){ const s=SETS.find(x=>ex.setIds.includes(x.id)); if(s) S.activeSet=s.id; go("learn",{manage:true}); }

function renderExamWrite(m,ex){
  if(ex.minutes&&examLeft(ex)===0) return submitExam(m,ex,true);
  const max=ex.tasks.reduce((a,t)=>a+t.points,0);
  m.innerHTML=`<div class="view">
   <div class="row"><button class="btn ghost sm" id="exBack">← Zurück</button><span class="spacer"></span><span class="pill mark">Probeklausur</span></div>
   <section class="sheet stack exam-head">
     <div class="row" style="align-items:flex-end"><div class="stack" style="gap:2px"><h1>${esc(ex.title)}</h1><p class="muted small">${ex.subject?esc(ex.subject)+" · ":""}${ex.tasks.length} Aufgaben · ${max} BE${ex.minutes?` · ${ex.minutes} Minuten`:""}</p></div><span class="spacer"></span>
     ${ex.minutes?`<div class="stack" style="gap:0;align-items:flex-end"><span class="label">Restzeit</span><span class="score mono exam-clock" id="exClock">${fmtClock(examLeft(ex))}</span></div>`:""}</div>
     <p class="small muted">Deine Antworten werden beim Tippen gespeichert. Du kannst die Seite verlassen und später weiterschreiben${ex.minutes?"; die Zeit läuft weiter":""}.</p>
   </section>
   ${ex.tasks.map(t=>`<section class="sheet stack" style="gap:10px">
     <div class="q-head"><b>Aufgabe ${t.nr}</b><span class="pill">${t.points} BE</span><span class="pill warn">${AFB_LABEL[t.afb]}</span></div>
     <p class="q-prompt" style="white-space:pre-line">${esc(t.prompt)}</p>
     <textarea data-tid="${t.id}" placeholder="Deine Antwort …" style="min-height:140px">${esc(ex.answers[t.id]||"")}</textarea>
   </section>`).join("")}
   <section class="sheet row"><span class="small muted" id="exCount"></span><span class="spacer"></span><button class="btn primary" id="exSubmit">Abgeben und korrigieren lassen</button></section>
  </div>`;
  const count=()=>{ const n=ex.tasks.filter(t=>(ex.answers[t.id]||"").trim()).length; $("#exCount").textContent=`${n} von ${ex.tasks.length} Aufgaben bearbeitet`; };
  count();
  $$("[data-tid]").forEach(a=>a.oninput=()=>{ ex.answers[a.dataset.tid]=a.value; save(false); count(); });
  $("#exBack").onclick=()=>{ save(); backFromExam(ex); };
  $("#exSubmit").onclick=async()=>{
    const open=ex.tasks.length-ex.tasks.filter(t=>(ex.answers[t.id]||"").trim()).length;
    if(await confirmBox(open?`Abgeben? ${open} Aufgabe${open>1?"n sind":" ist"} noch leer.`:"Klausur abgeben?","Abgeben")) submitExam(m,ex,false);
  };
  if(ex.minutes){
    const iv=setInterval(()=>{ const left=examLeft(ex); const c=$("#exClock"); if(c){ c.textContent=fmtClock(left); c.classList.toggle("low",left<=300); }
      if(left===0){ clearInterval(iv); submitExam(m,ex,true); } },1000);
    cleanup.push(()=>clearInterval(iv));
  }
}
async function submitExam(m,ex,timeUp){
  cleanup.forEach(f=>{try{f()}catch{}}); cleanup=[];
  ex.phase="grading"; ex.submittedAt=ex.submittedAt||Date.now(); ex.timeUp=ex.timeUp||timeUp; save();
  renderExamResult(m,ex);
}

function renderExamResult(m,ex){
  if(ex.phase==="grading"){
    m.innerHTML=`<div class="view"><section class="sheet stack">
      ${ex.timeUp?`<div class="note warn">Die Zeit ist abgelaufen. Deine Klausur wurde automatisch abgegeben.</div>`:""}
      <div class="row" id="exGr"><span class="spin"></span><span>Claude korrigiert deine Klausur nach dem Erwartungshorizont …</span></div></section></div>`;
    if(!CAP.sample){ $("#exGr").innerHTML=`<div class="note bad">${esc(sampleErr({code:"not_granted"}))}</div>`; return; }
    gradeExam(ex).then(g=>{ ex.grading=g; ex.phase="done"; save(); if(ROUTE.v==="exam") renderExamResult($("#main"),ex); })
      .catch(e=>{ const el=$("#exGr"); if(!el) return; el.innerHTML=`<div class="stack"><div class="note bad">${esc(sampleErr(e))}</div><div><button class="btn primary" id="exRetry">Noch einmal korrigieren</button></div></div>`; $("#exRetry").onclick=()=>renderExamResult($("#main"),ex); });
    return;
  }
  const g=ex.grading; const est=gradeEstimate(g.pct,S.profile);
  const byAfb={}; ex.tasks.forEach(t=>{ const b=byAfb[t.afb] ||= {got:0,max:0}; b.got+=g.tasks[t.id].points; b.max+=t.points; });
  const nf=v=>String(v).replace(".",",");
  m.innerHTML=`<div class="view">
   <div class="row"><button class="btn ghost sm" id="exBack">← Zurück</button><span class="spacer"></span><span class="pill mark">Probeklausur</span></div>
   <section class="sheet stack" style="gap:16px">
     <div class="row" style="align-items:flex-end;gap:18px"><div class="score mono">${esc(est.main)}</div><div class="stack" style="gap:2px"><h2>${esc(ex.title)}</h2><p class="muted">${nf(g.got)} von ${g.max} BE · ${g.pct} %${est.sub?` · ${esc(est.sub)}`:""}</p></div></div>
     <p class="small muted">Notenschätzung nach der Notenpunkte-Skala der Oberstufe${S.profile&&S.profile.track==="uni"?" bzw. dem üblichen Hochschulschlüssel":""}. Deine Lehrkraft kann einen anderen Schlüssel verwenden.</p>
     ${ex.timeUp?`<div class="note warn small">Abgegeben, weil die Zeit abgelaufen war.</div>`:""}
     ${g.overall?`<div class="feedback" style="border:1px solid var(--line)"><b>Rückmeldung</b><p>${esc(g.overall)}</p></div>`:""}
     <div class="scrollx"><table class="t"><thead><tr><th>Anforderungsbereich</th><th style="text-align:right">BE</th><th style="text-align:right">Quote</th></tr></thead><tbody>
      ${["I","II","III"].filter(k=>byAfb[k]).map(k=>`<tr><td>${AFB_LABEL[k]}</td><td class="n">${nf(byAfb[k].got)} / ${byAfb[k].max}</td><td class="n">${Math.round(byAfb[k].got/byAfb[k].max*100)} %</td></tr>`).join("")}
     </tbody></table></div>
     <div class="row"><button class="btn primary" id="exNew">Neue Probeklausur</button></div>
   </section>
   ${ex.tasks.map(t=>{ const r=g.tasks[t.id]; const full=r.points>=t.points, none=r.points===0; return `<section class="sheet stack" style="gap:10px">
     <div class="q-head"><b>Aufgabe ${t.nr}</b><span class="pill ${full?"ok":none?"":"warn"}">${nf(r.points)} / ${t.points} BE</span><span class="pill warn">AFB ${t.afb}</span></div>
     <p style="white-space:pre-line"><b>${esc(t.prompt)}</b></p>
     <div><span class="label">Deine Antwort</span><p class="pre" style="white-space:pre-wrap">${esc(ex.answers[t.id]||"–")}</p></div>
     <div class="feedback ${full?"ok":"bad"}"><p>${esc(r.feedback)}</p>
       <div><span class="label">Erwartungshorizont</span><p>${esc(t.expectation)}</p></div>
       <div><span class="label">Beleg aus ${esc(t.fileName)}</span><p class="quote">„${esc(t.quote)}“</p></div></div>
   </section>`; }).join("")}
  </div>`;
  $("#exBack").onclick=()=>backFromExam(ex);
  $("#exNew").onclick=()=>openExamDialog(SETS.find(s=>ex.setIds.includes(s.id))||null,{subject:ex.subject});
}

// Ablauf, jeder Schritt wird gespeichert und wiederverwendet:
//   1. Informationseinheiten: Claude zerlegt die bereits gelesenen Abschnitte in fachliche Aussagen, jede mit wörtlichem Beleg.
//      Merkwerk prüft jeden Beleg und jede Zahl selbst gegen das Material; Einheiten ohne Beleg fallen weg.
//   2. Inhaltsgrundlage: je Ausführlichkeit eine feste Auswahl dieser Einheiten (Kurz = Rang 1, Standard = Rang 1–2, Ausführlich = alle).
//   3. Skript: Zusammenfassung und Podcast entstehen aus derselben Grundlage; jedes Segment nennt die Einheiten, die es vermittelt.
//   4. Prüfung: lokal (jede Einheit enthalten, keine fremden Zahlen) und durch Claude (nichts erfunden, nichts verfälscht);
//      beanstandete Segmente korrigiert Claude, danach wird erneut geprüft (höchstens zwei Runden).

// Quelle sind ausschließlich die hochgeladenen Dateien, die man ausdrücklich auswählt (nie recherchierte Inhalte, Bildungspläne,

function localCheck(meta,ids,segments){
  const basis=new Set(ids), problems=[];

    const foreign=s.einheiten.filter(id=>!basis.has(id));
    if(foreign.length){ s.einheiten=s.einheiten.filter(id=>basis.has(id)); }
    const nums=[...new Set(numbersOf(s.text).filter(n=>!allowed.has(n)))];
    if(nums.length) problems.push({segment:i,einheit:null,art:"erfunden",detail:`Zahl${nums.length>1?"en":""} ${nums.join(", ")} steht in keiner Einheit der Grundlage`,quelle:"lokal"});
  });

  for(const id of ids) if(!covered.has(id)) problems.push({segment:null,einheit:id,art:"fehlend",detail:"Einheit kommt im Hauptteil nicht vor",quelle:"lokal"});

}

function checkPrompt(meta,ids,segments,fmt,lang){

INHALTSGRUNDLAGE
${basisText(meta,ids)}

function repairPrompt(meta,ids,segments,fmt,lang,problems){

- "erfunden" oder "verfaelscht": ersetze das Segment so, dass es nur noch Inhalte der Einheiten mit unveränderter Bedeutung enthält.
- "fehlend": füge die Einheit an der inhaltlich passenden Stelle im Hauptteil ein (neues Segment nach einem bestehenden), vollständig und unverändert.

// Korrekturen anwenden: von hinten nach vorne, damit die Nummern stimmen
function applyRepairs(segments,korrekturen,fmt){
  const out=[...segments];

  list.sort((a,b)=>(b.segment??b.nach+0.5)-(a.segment??a.nach+0.5));
  for(const k of list){ const neu=cleanSegments(k.neu,fmt);
    if(Number.isInteger(k.segment)){ if(k.segment>=0&&k.segment<out.length) out.splice(k.segment,1,...neu); }
    else if(k.nach>=-1&&k.nach<out.length) out.splice(k.nach+1,0,...neu); }
  return out;
}
async function claudeCheck(meta,ids,segments,fmt,lang,signal){

}
async function checkAndRepair(set,meta,ids,script,fmt,lang,{signal,onStatus}={}){
  let segments=script.segments, rounds=0, semantic=!!CAP.sample&&!set.example, problems=[], covered=0;

// Vor der Sprachausgabe: Was nach den Korrekturrunden noch unbelegt oder abweichend ist, wird entfernt.
// Fehlt danach eine Einheit oder lässt sich eine unbelegte Stelle keinem Segment zuordnen, stoppt die Erstellung („blocked“)
// mit den konkreten Stellen; erst nach ausdrücklicher Bestätigung entsteht Audio ohne die fehlenden Inhalte.
function enforceSupport(meta,ids,script){
  const c=script.check; if(!c||c.ok) return script;
  const bad=p=>p.art==="erfunden"||p.art==="verfaelscht";
  const drop=new Set(c.problems.filter(p=>bad(p)&&p.segment!=null&&p.segment<script.segments.length).map(p=>p.segment));
  const unplaced=c.problems.filter(p=>bad(p)&&(p.segment==null||p.segment>=script.segments.length));
  const segments=script.segments.filter((_,i)=>!drop.has(i)).map(s=>({...s,einheiten:[...s.einheiten]}));

// Teile für die Sprachausgabe: lange Segmente an Satzgrenzen teilen, Pausen nach Art des Übergangs
function splitSpeech(text,max=900){
  const out=[]; let buf="";
  const sents=String(text).split(/(?<=[.!?…])\s+/);
  for(let s of sents){
    while(s.length>max){ const cut=Math.max(s.lastIndexOf(", ",max),s.lastIndexOf(" ",max)); const i=cut>max/3?cut+1:max; if(buf){out.push(buf);buf="";} out.push(s.slice(0,i).trim()); s=s.slice(i).trim(); }
    if(buf&&(buf+" "+s).length>max){ out.push(buf); buf=""; }
    buf+=(buf?" ":"")+s;
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}
const ttsRole=(fmt,seg)=>fmt==="podcast"?(seg.sprecher==="B"?"experte":"moderation"):"erzaehler";
function ttsPlan(segments,fmt){
  const pieces=[];

    const parts=splitSpeech(s.text), next=segments[i+1];
    parts.forEach((text,j)=>{
      let gap=200; // innerhalb eines Segments
      if(j===parts.length-1){ if(!next) gap=0; else if(next.teil!==s.teil) gap=750; else if(fmt==="podcast") gap=next.sprecher!==s.sprecher?300:250; else gap=450; }
      pieces.push({seg:i,text,role:ttsRole(fmt,s),gap});
    });
  });
  return pieces;
}
function ttsBatches(pieces,maxChars=4500,maxCount=12){

  for(const p of pieces){ if(cur.length&&(n+p.text.length>maxChars||cur.length>=maxCount)){ out.push(cur); cur=[]; n=0; } cur.push(p); n+=p.text.length; }
  if(cur.length) out.push(cur);

}

const b64bytes=b64=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
async function synthesize(pieces,lang,{signal,onProgress,voices}={}){
  const batches=ttsBatches(pieces), clips=new Array(pieces.length); let got={}, provider="", done=0;

// Stille am Anfang und Ende entfernen (Schwelle etwa -42 dBFS), ein kurzer Rand bleibt, damit kein Wort abgeschnitten wird
function trimSilence(x,rate,thr=0.008,keepMs=60){
  let a=0, b=x.length-1; while(a<x.length&&Math.abs(x[a])<thr) a++; while(b>a&&Math.abs(x[b])<thr) b--;
  if(a>=x.length) return x.slice(0,0);

}
// Gleiche Lautheit für alle Teile: RMS der hörbaren Stellen auf Zielwert, Spitzen höchstens 0,97
function normalizeGain(x,target=0.1){
  let s=0, n=0, peak=0; for(let i=0;i<x.length;i++){ const v=Math.abs(x[i]); if(v>peak) peak=v; if(v>0.01){ s+=v*v; n++; } }
  if(!n||!peak) return x;
  const g=Math.min(target/Math.sqrt(s/n),0.97/peak), y=new Float32Array(x.length);
  for(let i=0;i<x.length;i++) y[i]=x[i]*g; return y;
}
// Teile mit festen Pausen und kurzen Blenden (gegen Knacken) aneinanderhängen; liefert auch die Startzeit jedes Teils
function assemblePcm(clips,rate){

    starts.push(p/rate); const x=c.pcm, f=Math.min(fade,Math.floor(x.length/2));
    for(let i=0;i<x.length;i++){ let v=x[i]; if(i<f) v*=i/f; else if(i>=x.length-f) v*=(x.length-1-i)/f; out[p+i]=v; }
    p+=x.length+Math.round(rate*(c.gap||0)/1000);
  }
  return {pcm:out,starts,duration:total/rate};
}
const toInt16=pcm=>{ const o=new Int16Array(pcm.length); for(let i=0;i<pcm.length;i++){ const v=clamp(pcm[i],-1,1); o[i]=v<0?v*0x8000:v*0x7fff; } return o; };

    base.variants[basisKey(len,null)]={len,themen:null,unitIds:v.unitIds||[],scripts:v.scripts||{}};
    for(const [vk,a] of Object.entries(v.audio||{})){ const [fmt,lang]=vk.split("|"); const sc=(v.scripts||{})[vk]; if(!sc) continue;
      recs.push({id:`alt_${len}_${fmt}_${lang}`,title:sc.titel||base.titel||"Aufnahme",createdAt:a.createdAt||Date.now(),fmt,len,lang,themen:null,src:meta.hash,files:null,
        script:{titel:sc.titel,segments:sc.segments,check:sc.check},duration:a.duration,segStarts:a.segStarts,mime:a.mime,size:a.size,provider:a.provider,voices:a.voices||{},storage:"idb",
        blobKey:`a|${setId}|${len}|${fmt}|${lang}`,lastPos:0}); }
  }
  return {key:"m|"+setId,setId,account:meta.account||null,v:3,bases:meta.hash?{[meta.hash]:base}:{},recs,createdAt:meta.createdAt||Date.now()};
}
async function audMeta(setId){
  const meta=audMigrate(await idb.aGet("m|"+setId),setId), extra=AUD_UNSAVED.get(setId)||[];
  if(meta&&extra.length) for(const r of extra) if(!meta.recs.some(x=>x.id===r.id)) meta.recs.unshift(r);
  return meta;
}
// Nicht gespeicherte Aufnahme erneut speichern
async function audRetrySave(setId,recId){
  const meta=await audMeta(setId); const rec=meta&&meta.recs.find(r=>r.id===recId); if(!rec) return false;
  const key=recBlobKey(setId,rec), blob=AUD_MEM.get(key);
  try{ if(blob){ await idb.aPutStrict({key,setId,recId,blob,createdAt:Date.now()}); AUD_MEM.delete(key); }
    rec.storage=AUD_MEM.has(key)?"mem":"idb"; meta.updatedAt=Date.now(); await idb.aPutStrict(meta);
    AUD_UNSAVED.set(setId,(AUD_UNSAVED.get(setId)||[]).filter(r=>r.id!==recId)); return true; }
  catch{ return false; }
}
async function audSaveMeta(meta){ meta.updatedAt=Date.now(); await idb.aPut(meta); }
async function audDeleteSet(setId){ await idb.aDelPrefix("m|"+setId); await idb.aDelPrefix("a|"+setId+"|"); for(const k of [...AUD_MEM.keys()]) if(k.startsWith("a|"+setId+"|")) AUD_MEM.delete(k); }
async function audRecBlob(setId,rec){ const k=recBlobKey(setId,rec); if(AUD_MEM.has(k)) return AUD_MEM.get(k); const r=await idb.aGet(k); return r&&r.blob||null; }
// Grundlagen, die keine Aufnahme mehr braucht und die nicht zur aktuellen Auswahl gehören, fallen weg (höchstens 4 bleiben)
function pruneBases(meta,keep){
  const used=new Set([keep,...meta.recs.map(r=>r.src)]);
  const extra=Object.values(meta.bases).filter(b=>!used.has(b.src)).sort((a,b)=>b.createdAt-a.createdAt);
  for(const b of extra.slice(Math.max(0,4-used.size))) delete meta.bases[b.src];
}
async function audDeleteRec(setId,recId){
  const meta=await audMeta(setId); if(!meta) return; const rec=meta.recs.find(r=>r.id===recId); if(!rec) return;
  const k=recBlobKey(setId,rec); AUD_MEM.delete(k); await idb.aDelPrefix(k);
  meta.recs=meta.recs.filter(r=>r.id!==recId); await audSaveMeta(meta);
}
async function audUpdateRec(setId,recId,patch){
  const meta=await audMeta(setId); if(!meta) return; const rec=meta.recs.find(r=>r.id===recId); if(!rec) return;
  Object.assign(rec,patch); await audSaveMeta(meta);
}

// Fundstellen je Einheit (für Transkript und Quellenangaben einer Aufnahme)
const unitSources=(base,ids)=>{ const set=new Set(ids); return Object.fromEntries(base.units.filter(u=>set.has(u.id)).map(u=>[u.id,u.funde||[u.fileName]])); };

/* ---------- Generierungsaufträge (laufen im Hintergrund weiter, auch wenn die Ansicht wechselt) ---------- */
const AUD_JOBS={};
const audJobKey=(setId,o)=>[setId,o.analyzeOnly?"analyse":"",audHash((o.files||[]).join(",")),basisKey(o.len,o.themen),o.fmt,o.lang,JSON.stringify(o.voices||{})].join("|");
function audJob(setId,o){ return AUD_JOBS[audJobKey(setId,o)]||null; }
// Gleicher Auftrag läuft schon → denselben zurückgeben (kein doppeltes Erzeugen durch mehrfaches Klicken).
// Ein erneuter Versuch nach einem Fehler behält die Aufnahme-ID, damit nichts doppelt gespeichert wird.
function audStart(set,o){
  const k=audJobKey(set.id,o), prev=AUD_JOBS[k];
  if(prev&&prev.running) return prev;
  const recId=o.recId||(prev&&prev.error&&prev.recId)||rid("rec_");
  const job=AUD_JOBS[k]={key:k,setId:set.id,...o,recId,running:true,step:0,done:[],detail:"",error:null,result:null,ctl:new AbortController(),onChange:null};
  const emit=()=>{ try{ job.onChange&&job.onChange(job); }catch{} };
  const step=(i,detail="")=>{ for(let x=0;x<i;x++) if(!job.done.includes(x)) job.done.push(x); job.step=i; job.detail=detail; emit(); };
  job.promise=audPipeline(set,{...o,recId},{signal:job.ctl.signal,step}).then(r=>{ job.result=r; if(r.rec) step(AUD_STEPS.length-1); },e=>{ job.error=e; })
    .finally(()=>{ job.running=false; emit(); });
  return job;
}
// Prüft die ausgewählten Dateien; liefert {view, blockers, warnings}
function audCheckFiles(set,fileIds){
  const view=audView(set,fileIds), blockers=[], warnings=[];
  for(const f of view.files){ const i=fileIssue(f); if(i) (i.level==="block"?blockers:warnings).push({file:f,...i}); }
  return {view,blockers,warnings};
}
async function audPipeline(set,o,{signal,step}){
  const {len,fmt,lang,force,themen=null}=o;
  step(0);
  const {view,blockers}=audCheckFiles(set,o.files);
  if(!view.files.length) throw aiErr("no_files");
  if(blockers.length) throw Object.assign(aiErr("unreadable_files"),{files:blockers.map(b=>b.file.name)});
  const src=materialHash(view);
  let meta=await audMeta(set.id);
  if(!meta) meta={key:"m|"+set.id,setId:set.id,account:(currentAccount()||{}).id||null,v:3,bases:{},recs:[],createdAt:Date.now()};
  let base=meta.bases[src];
  if(!base||force==="all"){
    step(1); const u=await buildUnits(view,{signal});
    base=meta.bases[src]={src,fileIds:view.files.map(f=>f.id),files:fileState(view),titel:u.titel,themen:u.themen,units:u.units,hinweise:u.hinweise,dropped:u.dropped,createdAt:Date.now(),variants:{}};
    pruneBases(meta,src); await audSaveMeta(meta);
  }
  if(o.analyzeOnly) return {meta,base,src};
  step(2);
  const bk=basisKey(len,themen);
  const v=base.variants[bk]||(base.variants[bk]={len,themen:themen&&themen.length?[...themen]:null,unitIds:selectBasis(base.units,len,themen)});
  if(!v.unitIds.length) throw aiErr("no_units_topic");
  v.scripts ||= {};
  const vk=audVariantKey(fmt,lang);
  if(!v.scripts[vk]||force==="script"){
    step(3); const sc=await writeScript(view,base,v.unitIds,fmt,lang,{signal});
    step(4); const checked=enforceSupport(base,v.unitIds,await checkAndRepair(view,base,v.unitIds,sc,fmt,lang,{signal,onStatus:t=>step(4,t)}));
    v.scripts[vk]={...checked,fmt,lang,createdAt:Date.now()};
    await audSaveMeta(meta);
  }
  const sc=v.scripts[vk];
  const out={meta,base,variant:v,script:sc,src};
  if(sc.check&&sc.check.blocked&&!o.allowMissing) return {...out,blocked:true};
  const st=await ttsStatus(true);
  if(!st.ok) return {...out,noAudio:st.reason};
  await ttsConsent();
  step(5); const pieces=ttsPlan(sc.segments,fmt);
  const syn=await synthesize(pieces,lang,{signal,voices:o.voices,onProgress:(d,n)=>step(5,`Audio wird erzeugt … (Teil ${d} von ${n})`)});
  step(5,"Die Audioteile werden zusammengesetzt …");
  const file=await buildAudioFile(pieces,syn.clips);
  step(6); await verifyAudio(file);
  const label=[AUD_FORMATS[fmt].short,AUD_LENGTHS[len].n,themen&&themen.length?themen.join(", "):""].filter(Boolean).join(" · ");
  const rec={id:o.recId,title:`${sc.titel||base.titel||set.name} (${label})`,createdAt:Date.now(),fmt,len,lang,themen:themen&&themen.length?[...themen]:null,src,files:fileState(view),
    script:{titel:sc.titel,segments:sc.segments,check:sc.check},sources:unitSources(base,v.unitIds),hinweise:base.hinweise||[],voices:syn.voices,chosenVoices:o.voices||null,provider:syn.provider,duration:file.duration,segStarts:file.segStarts,mime:file.blob.type,size:file.blob.size,storage:"idb",lastPos:0,status:"fertig"};
  // Speichern; klappt das nicht, bleibt die Datei nur im Arbeitsspeicher und wird so gekennzeichnet
  const key=recBlobKey(set.id,rec);
  try{ await idb.aPutStrict({key,setId:set.id,recId:rec.id,blob:file.blob,createdAt:Date.now()}); AUD_MEM.delete(key); }
  catch{ AUD_MEM.set(key,file.blob); rec.storage="mem"; }
  const i=meta.recs.findIndex(r=>r.id===rec.id); if(i>=0) meta.recs[i]=rec; else meta.recs.unshift(rec);
  try{ meta.updatedAt=Date.now(); await idb.aPutStrict(meta); AUD_UNSAVED.set(set.id,(AUD_UNSAVED.get(set.id)||[]).filter(r=>r.id!==rec.id)); }
  catch{ rec.storage="mem"; if(!AUD_MEM.has(key)) AUD_MEM.set(key,file.blob); AUD_UNSAVED.set(set.id,[rec,...(AUD_UNSAVED.get(set.id)||[]).filter(r=>r.id!==rec.id)]); }
  return {...out,rec};
}

// Vor dem Start: nicht lesbare Dateien nicht stillschweigend überspringen, sondern die verbleibende Auswahl bestätigen lassen
function audPreflight(set,P,blockers,run){
  if(!blockers.length) return run();
  const rest=P.files.filter(id=>!blockers.some(b=>b.file.id===id)), restNames=rest.map(id=>(set.files.find(f=>f.id===id)||{}).name).filter(Boolean);
  modal(`<h3>Nicht alle ausgewählten Dateien sind lesbar</h3>
    <ul class="small">${blockers.map(b=>`<li><b>${esc(b.file.name)}</b> ${esc(b.text)}. ${esc(b.next)}</li>`).join("")}</ul>
    ${rest.length?`<p>Ohne diese Dateien bleiben ausgewählt: <b>${esc(restNames.join(", "))}</b>.</p>`:`<p>Ohne diese Dateien bleibt keine Datei übrig.</p>`}
    <div class="row">${rest.length?`<button class="btn primary" id="pfGo">Ohne diese Dateien fortfahren</button>`:""}<button class="btn" id="pfSwap">Datei austauschen</button><button class="btn ghost" data-close>Auswahl ändern</button></div>`,(m,close)=>{
    const g=$("#pfGo",m); if(g) g.onclick=()=>{ close(); P.files=rest; (S.audioSel ||= {})[set.id]=[...rest]; save(false); run(); };

  });
}
function audSetupNote(scriptReady){

    :"Der Merkwerk-Server ist gerade nicht erreichbar.";

function checkBadge(c){

  if(c.ok) return `<div class="note small"><b>Geprüft:</b> alle ${c.total} Inhalte der Grundlage enthalten, nichts hinzugefügt${c.semantic?" (automatisch gegen deine Dateien geprüft"+(c.rounds?`, ${c.rounds} Korrekturrunde${c.rounds>1?"n":""}`:"")+")":" (lokale Prüfung; die inhaltliche Prüfung durch Claude war nicht möglich)"}.${removed}</div>`;
  return `<div class="note ${c.blocked?"bad":"warn"} small"><b>${c.blocked?"Erstellung gestoppt":"Nicht vollständig geprüft"}:</b> ${c.problems.length} offene ${c.problems.length===1?"Stelle":"Stellen"}.${removed}<ul>${c.problems.map(p=>`<li>${esc({fehlend:"Fehlt",erfunden:"Nicht belegt",verfaelscht:"Abweichend"}[p.art]||p.art)}${p.segment!=null?` (Abschnitt ${p.segment+1})`:""}${p.einheit?` (${esc(p.einheit)})`:""}: ${esc(p.detail)}</li>`).join("")}</ul></div>`;
}
// Quellen eines Segments: Fundstellen aller Einheiten, die es ausspricht
const segSources=(seg,sources)=>[...new Set((seg.einheiten||[]).flatMap(id=>(sources&&sources[id])||[]))];
function transcriptHTML(segments,fmt,sources,au){
  return `<ol class="aud-tx" id="txList">${segments.map((s,i)=>{ const src=segSources(s,sources);
    return `<li data-i="${i}"${au&&au.segStarts&&au.segStarts[i]!=null?` data-t="${au.segStarts[i]}" tabindex="0" role="button" aria-label="Ab hier abspielen"`:""}>${fmt==="podcast"?`<b>${esc(AUD_SPEAKER[s.sprecher])}:</b> `:""}${esc(s.text)}${src.length?`<span class="aud-src small muted">Quelle: ${esc(src.join(" · "))}</span>`:""}</li>`; }).join("")}</ol>`;
}
function transcriptText(sc,fmt,title,{sources,files,date,hinweise}={}){
  const head=[title,date?`Erstellt am ${new Date(date).toLocaleString("de-DE")}`:"",files&&files.length?`Quellen (ausschließlich hochgeladene Dateien): ${files.map(f=>f.name).join(", ")}`:""].filter(Boolean).join("\n");
  const body=sc.segments.map(s=>{ const src=segSources(s,sources); return (fmt==="podcast"?AUD_SPEAKER[s.sprecher]+": ":"")+s.text+(src.length?`\n   [Quelle: ${src.join(" · ")}]`:""); }).join("\n\n");
  const hw=hinweise&&hinweise.length?"\n\nHinweise zu den Dateien:\n"+hinweise.map(h=>`- ${h.art}${h.datei?` (${h.datei})`:""}: ${h.text}`).join("\n"):"";
  return head+"\n\n"+body+hw+"\n";
}
async function downloadText(name,text){
  const filename=name.replace(/[\\/:*?"<>|]+/g,"-");
  if(CAP.downloads){ try{ await CAP.downloads.save({filename,data:text}); return; }catch(e){ if(e&&e.code==="declined") return; } }
  const url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
// Aktuelles Skript zur Auswahl: Prüfergebnis, Transkript mit Quellen, Ersatz-Vorlesen ohne Sprachdienst

    ${sc.check&&sc.check.blocked?`<div class="row">${sc.check.canSkipMissing?`<button class="btn" id="scSkip">Ohne die fehlenden Inhalte erzeugen</button>`:""}<button class="btn primary" id="scRedo">Skript neu erstellen</button></div><p class="small muted">Es entsteht kein Audio, solange du nicht ausdrücklich bestätigst. Unbelegte Stellen werden nie gesprochen.</p>`:""}

    <div id="devBox"></div></div>`;

  const sk=$("#scSkip",box); if(sk) sk.onclick=async()=>{ if(await confirmBox("Audio ohne die fehlenden Inhalte erzeugen? Die Aufnahme deckt dann nicht alles aus der Grundlage ab.","Trotzdem erzeugen")) start({allowMissing:true}); };

function watchJob(m,set,job){
  const steps=AUD_STEPS.map((t,i)=>i===3&&job.fmt==="podcast"?"Podcastdialog wird erstellt …":t);
  const draw=()=>{
    const el=$("#audStatus"); if(!el||!ROUTE.arg||!ROUTE.arg.audio||S.activeSet!==set.id) return;
    if(job.running){
      const shown=job.analyzeOnly?[0,1]:[0,1,2,3,4,5,6];
      el.innerHTML=`<div class="aud-steps"><ol>${shown.map(i=>`<li class="${job.done.includes(i)&&i!==job.step?"ok":i===job.step?"on":""}">${i===job.step?'<span class="spin" aria-hidden="true"></span>':job.done.includes(i)?"✓":"○"} ${esc(i===job.step&&job.detail?job.detail:steps[i])}</li>`).join("")}</ol>
        <div class="row"><span class="small muted">Du kannst Merkwerk währenddessen weiter benutzen. Ein weiterer Klick startet keinen zweiten Auftrag.</span><span class="spacer"></span><button class="btn sm" id="audStop">Abbrechen</button></div></div>`;
      $("#audStop").onclick=()=>job.ctl.abort();
      const g=$("#audGo"); if(g) g.disabled=true;
    } else if(job.error){
      if(job.error.code==="cancelled"){ el.innerHTML=`<div class="note small">Abgebrochen. Deine Auswahl, Einstellungen und fertige Aufnahmen sind erhalten.</div>`; return; }
      const acts=audErrActions(job.error);
      el.innerHTML=`<div class="note bad"><p>${esc(audErr(job.error))}</p>${job.error.files?`<p class="small">Betroffen: ${esc(job.error.files.join(", "))}</p>`:""}<p class="small">Deine Dateiauswahl, die Einstellungen${job.error.code!=="no_units"?", ein bereits geprüftes Skript":""} und fertige Aufnahmen sind erhalten.${job.fmt==="podcast"?" Es wird nicht ohne Rückfrage auf die Einzelstimme gewechselt.":""}</p>
        <div class="row">${acts.includes("retry")?`<button class="btn sm primary" id="erRetry">Erneut versuchen</button>`:""}${acts.includes("replace")?`<button class="btn sm" id="erSwap">Datei austauschen</button>`:""}${acts.includes("select")?`<button class="btn sm" id="erSel">Auswahl ändern</button>`:""}${acts.includes("voice")?`<button class="btn sm primary" id="erVoice">Andere Stimme wählen</button>`:""}</div></div>`;
      const on=(id,f)=>{ const b=$("#"+id,el); if(b) b.onclick=f; };
      on("erRetry",()=>{ const {key,setId,running,step,done,detail,error,result,ctl,onChange,promise,...o}=job; watchJob(m,set,audStart(set,o)); });
      on("erSwap",()=>go("learn",{manage:true}));
      on("erSel",()=>{ const s=$("#audSel"); if(s) s.scrollIntoView({block:"start"}); const c=$("[data-file]"); c&&c.focus(); });
      on("erVoice",()=>{ const s=$("[data-voice]"); if(s){ s.scrollIntoView({block:"center"}); s.focus(); } else toast("Der Sprachdienst bietet hier keine Stimmenauswahl an"); });
    } else if(!audPlaying()){
      const r=job.result||{};
      if(r.rec){ const P=audPrefs(set); P.open=r.rec.id; }
      renderAudio(m,set).then(()=>{ const s=$("#audStatus"); if(!s) return;
        if(r.rec) s.innerHTML=r.rec.storage==="mem"?`<div class="note bad small">${esc(audErr({code:"storage_failed"}))}</div>`:`<div class="note">${esc(AUD_STEPS[7])}</div>`;
        else if(r.blocked) s.innerHTML=`<div class="note bad small">Die Prüfung hat Stellen gefunden, die sich nicht belegen ließen. Es wurde kein Audio erzeugt; Details stehen beim Skript.</div>`; });
    }
  };
  job.onChange=draw; cleanup.push(()=>{ if(job.onChange===draw) job.onChange=null; }); draw();
}

    </div>
    <div class="row"><a class="btn sm" id="audDl" href="${url}" download="${esc(fname)}">Audio herunterladen (${ext.toUpperCase()}, ${(blob.size/1048576).toFixed(1).replace(".",",")} MB)</a><span class="small muted">${rec.storage==="mem"?"Nicht gespeichert":"Gespeichert auf diesem Gerät"}${rec.provider?` · Stimmen von ${esc(rec.provider==="google"?"Google Cloud Text-to-Speech":rec.provider==="openai"?"OpenAI":rec.provider)}`:""}</span></div>
    <p class="small muted">Tastatur im Player: Leertaste ▶/❚❚, ← → 10 Sekunden, ↑ ↓ Lautstärke.</p>
  </div>`;
  const a=$("#aud",box); audEl=a; a.playbackRate=rate; a.volume=S.audioVol??1;
  const seek=$("#audSeek",box), cur=$("#audCur",box), dur=$("#audDur",box), play=$("#audPlay",box), vol=$("#audVol",box);
  let dragging=false, lastSaved=rec.lastPos||0;
  const lis=$$("li[data-t]",box.parentElement);
  let lastSeg=-1;
  const savePos=()=>{ const t=Math.floor(a.currentTime||0); if(Math.abs(t-lastSaved)<3) return; lastSaved=t; rec.lastPos=t; audUpdateRec(set.id,rec.id,{lastPos:t}).catch(()=>{}); };
  const sync=()=>{
    if(!dragging){ seek.value=Math.floor(a.currentTime); } cur.textContent=fmtTime(a.currentTime); seek.setAttribute("aria-valuetext",`${fmtTime(a.currentTime)} von ${fmtTime(isFinite(a.duration)?a.duration:rec.duration)}`);
    if(rec.segStarts){ let k=-1; rec.segStarts.forEach((t,i)=>{ if(t!=null&&a.currentTime+0.05>=t) k=i; });
      if(k!==lastSeg){ lis.forEach(li=>li.classList.toggle("on",Number(li.dataset.i)===k)); lastSeg=k; } }
  };
  // Letzte Position wiederherstellen, ohne ungefragt abzuspielen
  a.onloadedmetadata=()=>{ if(isFinite(a.duration)){ seek.max=Math.max(1,Math.floor(a.duration)); dur.textContent=fmtTime(a.duration); } a.playbackRate=S.audioRate||1;
    if(rec.lastPos>5&&rec.lastPos<(isFinite(a.duration)?a.duration:rec.duration)-5){ a.currentTime=rec.lastPos; sync(); } };
  a.ontimeupdate=()=>{ sync(); if(!a.paused&&Math.floor(a.currentTime)%5===0) savePos(); };
  a.onplay=()=>{ play.textContent="❚❚"; play.setAttribute("aria-label","Pausieren"); };
  a.onpause=()=>{ play.textContent="▶"; play.setAttribute("aria-label","Abspielen"); savePos(); };
  a.onended=()=>{ play.textContent="▶"; play.setAttribute("aria-label","Abspielen"); lastSaved=-10; rec.lastPos=0; audUpdateRec(set.id,rec.id,{lastPos:0}).catch(()=>{}); };
  const toggle=()=>{ if(a.paused) a.play().catch(()=>toast("Wiedergabe nicht möglich")); else a.pause(); };
  play.onclick=toggle;
  const jump=d=>{ a.currentTime=clamp(a.currentTime+d,0,isFinite(a.duration)?a.duration:rec.duration||0); sync(); savePos(); };
  $("#audBack",box).onclick=()=>jump(-10); $("#audFwd",box).onclick=()=>jump(10);
  seek.oninput=()=>{ dragging=true; cur.textContent=fmtTime(seek.value); };
  seek.onchange=()=>{ a.currentTime=Number(seek.value); dragging=false; sync(); savePos(); };
  $$("[data-rate]",box).forEach(b=>b.onclick=()=>{ S.audioRate=Number(b.dataset.rate); a.playbackRate=S.audioRate; save(false); $$("[data-rate]",box).forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
  const setVol=x=>{ a.volume=clamp(x,0,1); vol.value=a.volume; S.audioVol=a.volume; save(false); };
  vol.oninput=e=>setVol(Number(e.target.value));
  $(".aud-player",box).onkeydown=e=>{
    if(e.target.closest("input,select,textarea")) return; // Schieberegler behalten ihre eigenen Pfeiltasten
    if(e.key===" "||e.key==="k"){ if(e.target.tagName==="BUTTON"&&e.key===" ") return; e.preventDefault(); toggle(); }
    else if(e.key==="ArrowLeft"||e.key==="j"){ e.preventDefault(); jump(-10); }
    else if(e.key==="ArrowRight"||e.key==="l"){ e.preventDefault(); jump(10); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setVol(a.volume+0.1); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); setVol(a.volume-0.1); }
  };
  lis.forEach(li=>{ const go=()=>{ a.currentTime=Number(li.dataset.t); a.play().catch(()=>{}); };
    li.onclick=go; li.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }; });
  audTeardown.push(savePos);
  // Steuerung auf dem Sperrbildschirm und mit Medientasten
  if(navigator.mediaSession){ try{
    navigator.mediaSession.metadata=new MediaMetadata({title:rec.title,artist:"Merkwerk · "+AUD_FORMATS[rec.fmt].short,album:set.name});
    navigator.mediaSession.setActionHandler("play",()=>a.play()); navigator.mediaSession.setActionHandler("pause",()=>a.pause());
    navigator.mediaSession.setActionHandler("seekbackward",()=>jump(-10)); navigator.mediaSession.setActionHandler("seekforward",()=>jump(10));
  }catch{} }
}

/* ---------- Ersatz ohne Audiodatei: Gerätestimme liest das geprüfte Skript ---------- */
function mountDeviceReader(box,sc,fmt,lang){
  if(!box) return;
  const synth=window.speechSynthesis;
  if(!synth||!window.SpeechSynthesisUtterance){ box.innerHTML=""; return; }
  const loc={de:"de",en:"en",fr:"fr",es:"es",it:"it"}[lang];
  box.innerHTML=`<div class="aud-player stack" style="gap:10px">
    <div class="row"><b>Ersatz: Gerätestimme</b><span class="pill warn">keine Audiodatei</span></div>
    <p class="small muted">Liest das geprüfte Skript mit der Stimme deines Geräts vor. Klingt weniger natürlich, wird nicht gespeichert und lässt sich nicht herunterladen.</p>
    <div class="aud-ctrl"><button class="btn" id="dvPrev" aria-label="Vorheriger Abschnitt">⏮</button><button class="btn primary aud-play" id="dvPlay" aria-label="Vorlesen">▶</button><button class="btn" id="dvNext" aria-label="Nächster Abschnitt">⏭</button></div>
    <p class="small mono" id="dvPos" style="text-align:center">Abschnitt 1 von ${sc.segments.length}</p>
  </div>`;
  let i=0, on=false;
  const voices=()=>synth.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith(loc));
  const lis=$$("#txList li",box.parentElement);
  const mark=()=>{ $("#dvPos",box).textContent=`Abschnitt ${i+1} von ${sc.segments.length}`; lis.forEach(li=>li.classList.toggle("on",on&&Number(li.dataset.i)===i)); };
  const speak=()=>{
    synth.cancel(); if(!on) return mark();
    const s=sc.segments[i]; const u=new SpeechSynthesisUtterance(s.text); const vs=voices();
    u.lang=vs[0]?vs[0].lang:loc; u.rate=S.audioRate||1;
    if(fmt==="podcast"){ const v=vs[s.sprecher==="B"?Math.min(1,vs.length-1):0]; if(v) u.voice=v; if(vs.length<2) u.pitch=s.sprecher==="B"?0.8:1.2; } else if(vs[0]) u.voice=vs[0];
    u.onend=()=>{ if(!on) return; if(i<sc.segments.length-1){ i++; speak(); } else { on=false; upd(); } };
    synth.speak(u); mark();
  };
  const upd=()=>{ const p=$("#dvPlay",box); p.textContent=on?"❚❚":"▶"; p.setAttribute("aria-label",on?"Anhalten":"Vorlesen"); mark(); };
  $("#dvPlay",box).onclick=()=>{ on=!on; upd(); if(on) speak(); else synth.cancel(); };
  $("#dvPrev",box).onclick=()=>{ i=Math.max(0,i-1); speak(); };
  $("#dvNext",box).onclick=()=>{ i=Math.min(sc.segments.length-1,i+1); speak(); };
  audTeardown.push(()=>{ on=false; try{synth.cancel();}catch{} });
}
