<title>Merkwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
/* Terminal-Oberfläche (Experiment): ein dunkles Thema für alle Geräte. Alle Farben, Schriften, Rahmen und Leuchteffekte kommen aus diesen Variablen. */
:root{
  --paper:#080C09; --sheet:#101812; --ink:#CFF5DC; --muted:#86A792; --line:#22432F; --line-hi:#2F6B47; --grid:#0D140F;
  --accent:#39FF88; --accent-ink:#03140A; --accent-soft:rgba(57,255,136,.09);
  --mark:#FFC24B; --mark-ink:#1C1300;
  --ok:#39FF88; --ok-soft:#0E2A19; --bad:#FF7A70; --bad-soft:#2C1211; --warn:#FFC24B; --warn-soft:#2A2109;
  --orange:#FF9F45; --orange-soft:#2B1A0A;
  --f-mono:"JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, Menlo, monospace;
  --f-display:var(--f-mono); --f-body:var(--f-mono);
  --r:3px; --shadow:none;
  --glow:0 0 16px rgba(57,255,136,.24), 0 0 36px rgba(57,255,136,.12);
  --glow-sm:0 0 10px rgba(57,255,136,.22);
  --card-hover:#12221A; --t:200ms ease;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Kopfzeile: Logo, Hauptnavigation, Konto */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 2px;margin-left:-2px;border-radius:10px;cursor:pointer;color:var(--ink)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.03em;line-height:1}
.brand b span{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.top-acc{display:flex;align-items:center;gap:8px;margin-left:auto;order:3;min-width:0}
.top-acc .acc{padding:3px 10px 3px 3px;min-height:36px}
.top-acc .who{max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;flex:none}
.avatar.big{width:48px;height:48px;font-size:1.3rem}
.acc-name{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest .tabs,.guest #profileChip{display:none!important}
.welcome{max-width:720px;margin-inline:auto;padding-top:clamp(12px,5vh,56px)}
.welcome-hero{gap:10px}
.welcome-hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.welcome-choice .wizard-opt{padding:22px 20px;min-height:110px;justify-content:center}
.welcome-choice .wizard-opt b{font-family:var(--f-display);font-size:1.25rem}
.wizard-opt.primary-opt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wizard-opt.primary-opt .muted{color:inherit;opacity:.85}
.welcome-card{gap:14px}
.welcome-card h1{font-size:clamp(1.5rem,4vw,2.1rem)}
.auth-list{gap:10px}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;width:100%;font-weight:700}
.track-pick{grid-template-columns:1fr 1fr}
.track-pick .wizard-opt{min-height:120px;justify-content:center;align-items:center;text-align:center}
.track-pick .wizard-opt b{font-family:var(--f-display);font-size:1.3rem}
.gen-src{display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;order:2;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap;min-height:40px}
.tab:hover{color:var(--ink);background:var(--paper)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.subj:focus-visible,.wizard-opt:focus-visible,.opt:focus-visible,.pick:focus-visible,.org-tile:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){.tabs{order:4;flex:none;width:calc(100% + 32px);margin:0 -16px;padding:0 12px 2px}.top-acc .who{display:none}.tab{padding:9px 10px}.tab-long{display:none}.top-in{padding-bottom:6px}}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn{min-height:38px;flex-shrink:0;max-width:100%}
.btn:hover{border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.btn-lg{padding:11px 18px;min-height:46px;font-size:1rem}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.88rem;min-height:32px}
.btn.ghost.sm{min-height:32px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip:active{transform:translateY(1px)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mark{background:var(--mark);color:var(--mark-ink)}

label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{
  border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.93rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:none}
.li .grow{flex:1;min-width:0}
.bar{height:10px;background:var(--grid);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.mark>i{background:var(--mark)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;background:var(--paper)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.scrollx{overflow-x:auto}
.pre{white-space:pre-wrap;font-size:.92rem;max-height:340px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
details>summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:99;max-width:min(92vw,520px);font-weight:700;box-shadow:var(--shadow)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

/* Symbole */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip .ic{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}

/* Startseite */
.home{gap:30px}
.view>section,.view>div{scroll-margin-top:120px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:38px}
.sec-head h2{font-size:1.25rem}
.hero{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;justify-content:space-between}
.hero h1{font-size:clamp(1.8rem,4vw,2.5rem)}
.hero p{max-width:60ch}
.intro{gap:16px;padding:22px}
.intro h2{font-size:1.3rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;counter-reset:st}
.steps li{display:flex;flex-direction:column;gap:3px;padding:14px 14px 14px 52px;border:1px solid var(--line);border-radius:12px;background:var(--paper);position:relative;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.set-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);box-shadow:var(--shadow);min-width:0}
.set-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.set-name{font-size:1.08rem;overflow-wrap:anywhere}
.set-next{font-weight:700}
.cur-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.cur-set b{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
@media (min-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);min-height:208px;min-width:0;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.tile:active{background:var(--accent-soft)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile[aria-busy="true"]{cursor:progress;opacity:.8}
.tile-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.tile-ic .ic{width:26px;height:26px}
.tile-t{font-family:var(--f-display);font-weight:700;font-size:1.16rem;line-height:1.2}
.tile-d{color:var(--muted);font-size:.95rem}
.tile-s{font-size:.86rem;font-weight:700}
.tile-s.warn{color:var(--warn)}
.tile-s.warn::before{content:"! ";}
.tile-cta{margin-top:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:40px}
.tile-cta .ic{width:18px;height:18px}
.tile:hover .tile-cta{filter:brightness(1.08)}
@media (max-width:560px){.tile{min-height:0;display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:14px;row-gap:4px}.tile>*{grid-column:2}.tile-ic{grid-column:1;grid-row:1/span 3;margin:0}.tile-cta{justify-self:start;margin-top:6px}}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.org-tile{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;color:var(--ink);min-height:68px;box-shadow:var(--shadow)}
.org-tile>.ic{width:28px;height:28px;color:var(--accent)}
.org-tile:hover{border-color:var(--accent)}
.org-tile:active{background:var(--accent-soft)}
.li-now{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
/* Lernset auswählen */
.pick-list{display:flex;flex-direction:column;gap:8px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;color:var(--ink);min-height:56px}
.pick:hover{border-color:var(--accent)}
.pick[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick b{overflow-wrap:anywhere}
.pick>.ic{width:18px;height:18px;color:var(--muted)}
/* Lernset-Leiste in den Lernansichten */
.modebar{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.modebar-set{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0}
.modebar-k{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modebar-n{font-family:var(--f-display);font-size:1.1rem;overflow-wrap:anywhere}
.modebar-modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.modebar-modes .chip{white-space:nowrap;min-height:36px}
.modebar-modes .chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Quiz */
.q-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-prompt{font-size:1.15rem;font-weight:700;line-height:1.4}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sheet);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.feedback{border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.quote{border-left:3px solid var(--mark);padding:4px 10px;font-style:italic;background:var(--sheet);border-radius:0 6px 6px 0}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:520px){.match-row{grid-template-columns:1fr}}
.cloze input{display:inline-block;width:auto;min-width:8ch;max-width:100%;padding:3px 8px;margin:2px}
.cloze input.right{border-color:var(--ok);background:var(--ok-soft)}
.cloze input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.03em}
.why{border-top:1px dashed var(--line);padding-top:8px}
.why-a{margin:0;white-space:pre-line}
.exam-head{position:sticky;top:0;z-index:5}
.exam-clock{font-size:2rem}
.exam-clock.low{color:var(--bad)}
@media (max-width:600px){.exam-head h1{font-size:1.3rem}.exam-head>p.small{display:none}.exam-clock{font-size:1.5rem}}
table.t{border-collapse:collapse;width:100%;font-size:.94rem}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n{font-family:var(--f-mono);text-align:right}

/* Stundenplan */
.tt{display:grid;gap:4px;min-width:640px}
.tt .h{font-weight:700;font-size:.85rem;text-align:center;padding:4px;color:var(--muted)}
.tt .time{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding:6px 4px;text-align:right;line-height:1.25}
.tt .cell{min-height:54px;border:1px dashed var(--line);border-radius:7px;background:var(--paper);cursor:pointer;padding:5px 6px;font-size:.82rem;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.tt .cell.filled{border-style:solid;border-color:transparent;background:var(--c,var(--accent-soft))}
.tt .cell b{font-size:.86rem;overflow-wrap:anywhere;color:var(--ink)}
.tt .cell span{color:var(--muted);font-size:.74rem}
.tt .cell.now{outline:2px solid var(--accent)}
.daycol{display:flex;flex-direction:column;gap:6px}

/* Termine */
.due{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 4px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.due b{font-family:var(--f-display);font-size:1.35rem;line-height:1}
.due span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.plan-day{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.plan-day.today{background:var(--mark);color:var(--mark-ink);border-radius:8px;padding-inline:8px}
.plan-day.today .muted{color:var(--mark-ink)}
.plan-day.done .what{text-decoration:line-through;opacity:.6}
@media (max-width:520px){.plan-day{grid-template-columns:1fr auto}.plan-day .d{grid-column:1/-1}}

/* Bibliothek */
.subj{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--sheet);cursor:pointer;min-width:0}
.subj:hover{border-color:var(--accent)}
.subj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.subj b{overflow-wrap:anywhere}
.wizard-opt{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;text-align:left}
.wizard-opt:hover{border-color:var(--accent)}
.entry-body{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
/* Kalender (FullCalendar) */
#calBox{--fc-border-color:var(--line);--fc-page-bg-color:var(--sheet);--fc-neutral-bg-color:var(--paper);--fc-list-event-hover-bg-color:var(--accent-soft);
  --fc-today-bg-color:color-mix(in oklab, var(--mark) 22%, transparent);--fc-now-indicator-color:var(--bad);
  --fc-button-bg-color:var(--sheet);--fc-button-border-color:var(--line);--fc-button-text-color:var(--ink);
  --fc-button-hover-bg-color:var(--accent-soft);--fc-button-hover-border-color:var(--accent);
  --fc-button-active-bg-color:var(--accent);--fc-button-active-border-color:var(--accent);
  --fc-event-bg-color:var(--accent);--fc-event-border-color:var(--accent);--fc-event-text-color:var(--accent-ink);
  --fc-bg-event-color:var(--line);--fc-bg-event-opacity:.45;--fc-highlight-color:var(--accent-soft);
  font-size:.9rem;min-width:0}
#calBox .fc-toolbar-title{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
#calBox .fc .fc-button{font-weight:700;border-radius:8px;text-transform:none;padding:5px 10px;font-size:.88rem}
#calBox .fc .fc-button-primary:not(:disabled).fc-button-active{color:var(--accent-ink)}
#calBox .fc .fc-button:focus{box-shadow:0 0 0 2px var(--accent)}
#calBox .fc-toolbar.fc-header-toolbar{flex-wrap:wrap;gap:8px}
#calBox .fc-footer-toolbar{margin-top:10px}
#calBox .fc-col-header-cell-cushion,#calBox .fc-daygrid-day-number,#calBox .fc-list-day-text,#calBox .fc-list-day-side-text{color:var(--ink);text-decoration:none}
#calBox .fc-timegrid-slot-label,#calBox .fc-timegrid-axis{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
#calBox .fc-event{cursor:pointer;border-radius:6px}
#calBox .fc-timegrid-event .fc-event-main{padding:2px 4px}
#calBox .ev-lesson .fc-event-main,#calBox .ev-lesson .fc-event-time,#calBox .ev-lesson .fc-event-title{color:var(--ink)}
#calBox .ev-cancel{opacity:.55}
#calBox .ev-cancel .fc-event-title{text-decoration:line-through}
#calBox .ev-klausur{--fc-event-bg-color:var(--warn);--fc-event-border-color:var(--warn);background:var(--warn);border-color:var(--warn)}
#calBox .ev-klausur .fc-event-main{color:var(--sheet);font-weight:700}
#calBox .ev-abgabe{background:var(--accent);border-color:var(--accent)}
#calBox .ev-abgabe .fc-event-main{color:var(--accent-ink);font-weight:700}
#calBox .ev-plan{background:var(--mark);border-color:var(--mark)}
#calBox .ev-plan .fc-event-main,#calBox .ev-plan .fc-event-title{color:var(--mark-ink)}
#calBox .ev-missed{outline:2px dashed var(--bad);outline-offset:-2px}
#calBox .ev-termin{background:var(--ok);border-color:var(--ok)}
#calBox .ev-termin .fc-event-main{color:var(--sheet)}
#calBox .ev-frei{background:var(--line);border-color:var(--line)}
#calBox .ev-frei .fc-event-main{color:var(--ink)}
#calBox .ev-done{opacity:.5}
#calBox .ev-done .fc-event-title{text-decoration:line-through}
#calBox .fc-daygrid-dot-event .fc-event-title,#calBox .fc-daygrid-dot-event .fc-event-time{color:var(--ink)}
#calBox .fc-list-event-title,#calBox .fc-list-event-time{color:var(--ink)}
#calBox .fc-list-day-cushion{background:var(--paper)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-k{background:var(--warn)}.lg-a{background:var(--accent)}.lg-p{background:var(--mark)}.lg-t{background:var(--ok)}.lg-f{background:var(--line)}

/* Karteikarten */
.wizard-opt:disabled{opacity:.5;cursor:not-allowed}
.fc-progress{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px auto 14px;width:min(100%,420px)}
.fc-progress .mono{font-size:1.05rem;color:var(--muted)}
.fc-progress .mono b{color:var(--ink);font-size:1.25rem}
.fc-bar{width:100%;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.fc-bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.fc-stage{display:grid;grid-template-columns:minmax(64px,1fr) minmax(0,3fr) minmax(64px,1fr);gap:14px;align-items:stretch;max-width:900px;width:100%;margin:0 auto}
.fc-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:14px;background:var(--sheet);cursor:pointer;padding:12px 6px;text-align:center;font-weight:700;color:var(--muted);min-width:0;transition:background .15s,border-color .15s,transform .15s}
.fc-zone .fc-count{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1}
.fc-zone .fc-zl{font-size:.9rem;line-height:1.2;overflow-wrap:anywhere}
.fc-zone .fc-arrow{font-size:1.1rem;opacity:.6}
.fc-zone.know .fc-count{color:var(--ok)}
.fc-zone.practice .fc-count{color:var(--orange)}
.fc-zone.know:hover,.fc-zone.know.hot{border-color:var(--ok);border-style:solid;background:var(--ok-soft);color:var(--ink)}
.fc-zone.practice:hover,.fc-zone.practice.hot{border-color:var(--orange);border-style:solid;background:var(--orange-soft);color:var(--ink)}
.fc-zone.hot{transform:scale(1.04)}
.fc-zone:focus-visible,.fc-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fc-card{perspective:1400px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:16px;min-width:0}
.fc-card.dragging{cursor:grabbing}
.fc-inner{display:grid;min-height:min(56vh,340px);transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px 20px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;min-width:0}
.fc-front{background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 28px;background-position:0 14px}
.fc-back{transform:rotateY(180deg)}
.fc-term{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,4.4vw,2.2rem);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.fc-def{font-size:1.1rem;line-height:1.5;overflow-wrap:anywhere}
.fc-back .quote{text-align:left;max-width:52ch}
@media (max-width:560px){.fc-stage{gap:8px;grid-template-columns:64px minmax(0,1fr) 64px}.fc-face{padding:20px 12px}.fc-zone .fc-zl{font-size:.74rem}}
@media (prefers-reduced-motion: reduce){.fc-inner,.fc-bar>i,.fc-zone{transition:none}}
.fc-chart{display:flex;justify-content:center;align-items:flex-start;gap:clamp(24px,8vw,64px);padding:8px 0 4px;border-bottom:1px solid var(--line)}
.fc-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(90px,24vw,140px)}
.fc-track{height:200px;width:100%;display:flex;align-items:flex-end;background:var(--paper);border-radius:10px 10px 0 0}
.fc-track>i{display:block;width:100%;border-radius:10px 10px 0 0;min-height:2px}
.fc-col.know .fc-track>i{background:var(--ok)}
.fc-col.practice .fc-track>i{background:var(--orange)}
.fc-val{font-weight:700;font-size:.95rem}
.fc-col.know .fc-val{color:var(--ok)}
.fc-col.practice .fc-val{color:var(--orange)}
.fc-cl{font-weight:700;font-size:.9rem;text-align:center;padding-bottom:8px;min-height:3.2em;line-height:1.3}
.fc-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:420px;width:100%;margin:0 auto}

/* Audio & Podcast */
.aud-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;background:var(--paper)}
.aud-opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;border-radius:9px;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);min-width:0}
.aud-opt b{font-family:var(--f-display);font-size:1.1rem;color:var(--ink)}
.aud-opt[aria-checked="true"]{background:var(--sheet);border-color:var(--accent);box-shadow:var(--shadow);color:var(--ink)}
.aud-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:440px){.aud-seg{grid-template-columns:1fr}.aud-opt b{font-size:1rem}}
.chip[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip:disabled{opacity:.5;cursor:not-allowed}
.aud-player{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.aud-seek{width:100%;accent-color:var(--accent)}
.aud-ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.aud-ctrl .btn{min-width:64px;min-height:44px}
.aud-play{width:64px;height:64px;border-radius:50%;font-size:1.4rem}
.aud-sub{gap:10px}
.aud-sub input[type=range]{accent-color:var(--accent)}
.aud-steps ol{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.aud-steps li{color:var(--muted)}
.aud-steps li.on{color:var(--ink);font-weight:700}
.aud-steps li.ok{color:var(--ok)}
.aud-tx{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.aud-tx li{padding:4px 6px;border-radius:6px;overflow-wrap:anywhere}
.aud-tx li[data-t]{cursor:pointer}
.aud-tx li[data-t]:hover{background:var(--accent-soft)}
.aud-tx li.on{background:var(--mark);color:var(--mark-ink)}
.aud-tx li:focus-visible{outline:2px solid var(--accent)}
.aud-src{display:block;margin-top:2px}
.aud-tx li.on .aud-src{color:inherit;opacity:.8}
.aud-file{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.aud-file input{margin-top:4px;width:18px;height:18px;flex:none}
.aud-file.off{opacity:.6;cursor:default}
.aud-modes{gap:6px}
.aud-player:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bad-t{color:var(--bad)}
.warn-t{color:var(--warn)}

/* ===== Terminal-Oberfläche: Komponenten ===== */
html{background:var(--paper)}
body{font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;caret-color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-color:var(--line-hi) var(--paper);scrollbar-width:thin}
h1,h2,h3{letter-spacing:0;font-weight:700}
h1{font-size:clamp(1.45rem,3.2vw,2rem)}
h2{font-size:1.2rem}
h3{font-size:1.02rem;color:var(--ink)}
.view h1::before,.modal h1::before,.modal h2:first-child::before{content:"> " / "";color:var(--accent)}
.sec-head h2::before{content:"// " / "";color:var(--muted);font-weight:400}
.label{letter-spacing:.12em;color:var(--muted)}
.label::before{content:"$ " / "";color:var(--accent)}
a{color:var(--accent);text-underline-offset:3px}
.mono{color:inherit}
/* Fokus: für Tastatur genauso deutlich wie Hover */
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px;box-shadow:var(--glow-sm)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);outline-offset:0;border-color:var(--accent);box-shadow:var(--glow-sm)}

/* Kopfzeile und Titel */
.top{background:rgba(8,12,9,.94);border-bottom:1px solid var(--line-hi);backdrop-filter:blur(6px)}
.brand{border-radius:var(--r);color:var(--accent);padding:4px 8px 4px 2px}
.brand b{font-family:var(--f-mono);font-weight:800;font-size:1.3rem;letter-spacing:.06em;color:var(--accent);text-shadow:0 0 12px rgba(57,255,136,.35)}
.brand b span{background:none;padding:0;border-radius:0;color:var(--accent)}
.brand .cursor{display:inline-block;animation:mw-blink 1.1s steps(1) infinite}
@keyframes mw-blink{50%{opacity:0}}
.tabs{gap:4px}
.tab{border:1px solid transparent;border-radius:var(--r);color:var(--muted);font-weight:500;padding:7px 10px;transition:color var(--t),border-color var(--t),background-color var(--t),box-shadow var(--t)}
.tab::before{content:"[ " / "";color:var(--line-hi);transition:color var(--t)}
.tab::after{content:" ]" / "";color:var(--line-hi);transition:color var(--t)}
.tab:hover{color:var(--ink);background:var(--accent-soft);border-color:var(--line)}
.tab:hover::before,.tab:hover::after{color:var(--accent)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.tab[aria-current="page"]::before,.tab[aria-current="page"]::after{color:var(--accent)}
.avatar{border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}

/* Flächen */
.sheet,.modebar,.modal,.aud-player{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.modal{border-color:var(--line-hi);box-shadow:0 0 0 1px rgba(57,255,136,.08),0 18px 60px rgba(0,0,0,.6)}
.overlay{background:rgba(2,5,3,.78)}
.pre,.entry-body,.dropzone,.due,.tt .cell,.fc-track,.aud-seg,.steps li{background:var(--paper);border-color:var(--line);border-radius:var(--r)}
.dropzone{border:1px dashed var(--line-hi);transition:border-color var(--t),box-shadow var(--t),background-color var(--t)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--card-hover);box-shadow:var(--glow)}
.empty{border:1px dashed var(--line-hi);border-radius:var(--r);color:var(--muted)}
.empty::before{content:"-- leer --" / "";display:block;font-size:.8rem;letter-spacing:.1em;color:var(--line-hi);margin-bottom:6px}
.li{border-top-color:var(--line)}
.li-now{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.steps li::before{border-radius:var(--r);content:counter(st)}

/* Schaltflächen */
.btn{border:1px solid var(--line-hi);background:var(--sheet);color:var(--ink);border-radius:var(--r);font-weight:500;transition:color var(--t),border-color var(--t),background-color var(--t),box-shadow var(--t)}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow-sm)}
.btn:active:not(:disabled){transform:none;filter:none;background:var(--card-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:none;color:var(--accent-ink);background:#6BFFA6;box-shadow:var(--glow)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);box-shadow:none}
.btn.ghost:hover{border-color:var(--line-hi);background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 45%,transparent)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad);box-shadow:0 0 10px rgba(255,122,112,.25)}
.linkbtn{color:var(--accent);text-underline-offset:3px}
.chip{border-radius:var(--r);border-color:var(--line-hi);background:var(--sheet);transition:border-color var(--t),box-shadow var(--t),color var(--t)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:active{transform:none}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]::before,.chip[aria-checked="true"]::before{content:"✓" / "";font-weight:700}
.modebar-modes .chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.modebar-modes .chip[aria-current="page"]::before{content:">" / "";font-weight:800}
.pill{border-radius:var(--r);background:transparent;border:1px solid var(--line-hi);color:var(--ink);font-weight:500;padding:0 7px}
.pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.mark{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:700}

/* Eingabefelder, Auswahllisten */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=email],input[type=password],input[type=search],select,textarea{background:var(--sheet);border:1px solid var(--line-hi);border-radius:var(--r);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--sheet);color:var(--ink)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
input[type=date],input[type=time]{color-scheme:dark}
label.f{font-weight:500;color:var(--muted)}
label.f>:is(input,select,textarea){color:var(--ink)}

/* Meldungen */
.note{background:var(--accent-soft);border:1px solid var(--line-hi);border-left:3px solid var(--accent);border-radius:var(--r)}
.note::before{content:"[info] " / "";color:var(--accent);font-weight:700}
.note.warn{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 40%,transparent);border-left-color:var(--warn)}
.note.warn::before{content:"[hinweis] " / "";color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in oklab,var(--bad) 40%,transparent);border-left-color:var(--bad)}
.note.bad::before{content:"[fehler] " / "";color:var(--bad)}
.feedback{border-radius:var(--r)}
.feedback.ok::before{content:"[ok] richtig" / "";color:var(--ok);font-weight:700;font-size:.85rem;letter-spacing:.06em}
.feedback.bad::before{content:"[x] falsch" / "";color:var(--bad);font-weight:700;font-size:.85rem;letter-spacing:.06em}
.toast{background:var(--sheet);color:var(--accent);border:1px solid var(--accent);border-radius:var(--r);box-shadow:var(--glow);font-weight:500}
.toast::before{content:"> " / ""}
.spin{border-radius:0;border:2px solid var(--line);border-top-color:var(--accent);border-right-color:var(--accent)}
.quote{background:var(--paper);border-left-color:var(--mark);border-radius:0 var(--r) var(--r) 0}
.bar{background:var(--paper);border-radius:0;border-color:var(--line-hi);height:8px}
.bar>i,.fc-bar>i{border-radius:0;background:var(--accent);box-shadow:0 0 8px rgba(57,255,136,.4)}
.bar.mark>i{background:var(--mark);box-shadow:none}
.fc-bar{border-radius:0}
details>summary{font-weight:700;color:var(--ink)}
details>summary::marker{color:var(--accent)}
table.t th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:.78rem;letter-spacing:.08em;border-bottom-color:var(--line-hi)}

/* Kategorie-Karten: dunkel mit feinem Rahmen, beim Darüberfahren grüner Schein ohne Größenänderung */
.tile,.org-tile,.set-card,.subj,.wizard-opt,.pick,.opt,.aud-opt{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:none;transition:border-color var(--t),box-shadow var(--t),background-color var(--t),color var(--t)}
.tile-t,.org-tile b,.subj b,.wizard-opt b,.pick b,.set-name{transition:color var(--t),text-shadow var(--t)}
@media (hover:hover){
  .tile:hover,.org-tile:hover,.set-card:hover,.subj:hover,.wizard-opt:not(:disabled):hover,.pick:hover,.opt:hover,.aud-opt:hover,.fc-zone:hover{border-color:var(--accent);background:var(--card-hover);box-shadow:var(--glow)}
  :is(.tile:hover .tile-t,.org-tile:hover b,.set-card:hover .set-name,.subj:hover b,.wizard-opt:not(:disabled):hover b,.pick:hover b){color:var(--accent);text-shadow:0 0 10px rgba(57,255,136,.35)}
}
:is(.tile,.org-tile,.subj,.wizard-opt,.pick,.opt):focus-visible{border-color:var(--accent);background:var(--card-hover);box-shadow:var(--glow)}
:is(.tile,.org-tile,.subj,.wizard-opt,.pick,.opt):active{background:var(--card-hover);border-color:var(--accent)}
.tile{min-height:200px}
.tile-ic{border-radius:var(--r);background:var(--paper);border:1px solid var(--line-hi);color:var(--accent)}
.tile-t{font-weight:700;font-size:1.06rem;color:var(--ink)}
.tile-t::before{content:"> " / "";color:var(--accent)}
.tile-d{color:var(--muted);font-size:.9rem}
.tile-cta{border-radius:var(--r);background:transparent;border:1px solid var(--accent);color:var(--accent);font-weight:700}
.tile-cta::before{content:"[" / ""}.tile-cta::after{content:"]" / ""}
.tile:hover .tile-cta,.tile:focus-visible .tile-cta{filter:none;background:var(--accent);color:var(--accent-ink)}
.org-tile>.ic{color:var(--accent)}
.set-card.on,.subj[aria-pressed="true"],.pick[aria-current="true"]{border-color:var(--accent);background:var(--card-hover);box-shadow:inset 3px 0 0 var(--accent)}
.subj[aria-pressed="true"] b::before,.pick[aria-current="true"] b::before{content:"> " / "";color:var(--accent)}
